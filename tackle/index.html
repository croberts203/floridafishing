<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a24">
<title>Tackle Box — Tie &amp; Tide</title>
<meta name="description" content="Tackle Box by Tie &amp; Tide: keep track of your lures, rigs and gear, see what to pack for the fish you're after, and what to buy before the trip.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0b1a24;--panel:#11263a;--panel2:#16304a;--line:#24435f;--text:#e8f0f6;--muted:#93a9bb;--accent:#f2b84b;--ink:#2a1d04;--teal:#3fd0b5;--bad:#e86a5c;--good:#66d17a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(11,26,36,.94);backdrop-filter:blur(10px);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
#logo{display:flex}#logo svg{display:block}
h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
h1 small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:12.5px;margin:14px 0 6px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
main{padding:12px 12px 20px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:12.5px}
select,input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:15px inherit;font-family:inherit;width:100%}
textarea{min-height:60px;resize:vertical}
label{font-size:12.5px;color:var(--muted);display:block;margin:10px 0 4px}
button{font-family:inherit}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 11px;font:600 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.wrap{flex-wrap:wrap;overflow:visible}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ic{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.nm{flex:1;min-width:0;cursor:pointer}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.nm span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:700 17px inherit;cursor:pointer}
.qty b{min-width:26px;text-align:center;font-size:16px}
.nm .pill,.pill{display:inline-block;width:auto;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.pill.low{background:rgba(232,106,92,.18);color:#ff9a8e}
.pill.ok{background:rgba(102,209,122,.16);color:#8fe39f}
.pill.miss{background:rgba(242,184,75,.16);color:var(--accent)}
.search{position:relative;margin-bottom:8px}
.search input{padding-left:36px}
.search:before{content:"🔍";position:absolute;left:11px;top:9px;font-size:15px;opacity:.7}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(17,38,58,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);padding:9px 0 8px;font:600 11.5px inherit;font-family:inherit;cursor:pointer;position:relative}
nav button svg{display:block;margin:0 auto 2px;width:23px;height:23px}
nav button.on{color:var(--accent)}
nav .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;border:0;background:var(--accent);color:var(--ink);border-radius:999px;padding:13px 18px;font:800 15px inherit;font-family:inherit;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet .top h2{flex:1;margin:0}
.x{border:0;background:var(--panel2);color:var(--muted);width:32px;height:32px;border-radius:999px;font-size:17px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f2232;border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw;text-align:center}
.empty{text-align:center;padding:26px 10px}
.empty .big{font-size:44px}
.rec{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .nm{cursor:default}
.rec .nm span{white-space:normal}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.chk.done span{color:var(--muted);text-decoration:line-through}
#scanner{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
#scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
#scanner .frame{position:absolute;left:12%;right:12%;top:30%;height:22%;border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scanner .bar{background:var(--panel);padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkcard{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--text);padding:10px 0;border-top:1px solid var(--line)}
.linkcard:first-of-type{border-top:0}
.appic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
a{color:var(--accent)}
.hidden{display:none!important}
.kit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
.kit b{display:block}
</style>
</head>

<script>
/* Fly Bench barcode reading, shared by the scanner screen.
   window.FBScan.start(video, onCode)  → reads barcodes from a playing <video>; returns stop()
   window.FBScan.decodeImage(file)     → reads a barcode from a photo (File/Blob); resolves code or null
   window.FBScan.normalize(code)       → one form per product (EAN-13 "0…" and UPC-A are the same code)
   Uses the browser's own BarcodeDetector where it exists (Chrome on Android, desktop Chrome) and the
   ZXing library everywhere else (iPhone/iPad Safari, Firefox). ZXing decodes still frames drawn to a canvas;
   it never attaches to the video itself, which is what stalled on iPhones before. */
(function () {
  if (window.FBScan) return;
  var FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39"];
  var ZXING_URLS = ["https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js",
                    "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"];

  function normalize(code) {
    var d = String(code || "").trim();
    if (/^\d+$/.test(d) && d.length === 13 && d.charAt(0) === "0") d = d.slice(1); // EAN-13 with leading 0 = UPC-A
    return d;
  }

  var zx = null;
  function loadZXing() {
    if (window.ZXing) return Promise.resolve(window.ZXing);
    if (zx) return zx;
    zx = new Promise(function (ok, no) {
      var i = 0;
      (function next() {
        if (i >= ZXING_URLS.length) { zx = null; return no(new Error("Couldn't load the barcode reader. Check your connection, or type the code.")); }
        var s = document.createElement("script"); s.src = ZXING_URLS[i++]; s.async = true;
        s.onload = function () { window.ZXing ? ok(window.ZXing) : next(); };
        s.onerror = function () { s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
    return zx;
  }

  var reader = null;
  function zxReader(Z) {
    if (reader) return reader;
    var hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A,
      Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    reader = new Z.MultiFormatReader(); reader.setHints(hints);
    return reader;
  }
  function zxDecodeCanvas(Z, canvas) {
    try {
      var src = new Z.HTMLCanvasElementLuminanceSource(canvas);
      var r = zxReader(Z).decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(src)));
      return r ? r.getText() : null;
    } catch (e) { return null; } // NotFoundException etc. = nothing in this frame
  }

  // Draw a region of the source into a canvas, scaled so the long side is at most `max` px.
  function frame(canvas, srcEl, sw, sh, sx, sy, cw, ch, max) {
    var k = Math.min(1, max / Math.max(cw, ch));
    canvas.width = Math.round(cw * k); canvas.height = Math.round(ch * k);
    var g = canvas.getContext("2d", { willReadFrequently: true });
    g.drawImage(srcEl, sx, sy, cw, ch, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  function start(video, onCode, onInfo) {
    var running = true, timer = null, frames = 0, lastInfo = 0;
    function info(extra) { var now = Date.now(); if (!onInfo || (now - lastInfo < 1200 && !extra)) return; lastInfo = now;
      try { onInfo({ mode: native ? "built-in reader" : (window.ZXing ? "ZXing reader" : "loading reader"), frames: frames, size: (video.videoWidth || 0) + "×" + (video.videoHeight || 0), note: extra || "" }); } catch (e) {} }
    var native = ("BarcodeDetector" in window) ? new window.BarcodeDetector({ formats: FORMATS }) : null;
    var canvas = document.createElement("canvas"), turn = 0;
    function emit(c) { c = normalize(c); if (c) onCode(c); }
    function schedule(ms) { if (running) timer = setTimeout(tick, ms); }
    function tick() {
      if (!running) return;
      if (video.readyState < 2 || !video.videoWidth) { info(); return schedule(200); }
      frames++; info();
      if (native) {
        native.detect(video).then(function (r) { if (running && r && r[0]) emit(r[0].rawValue); }).catch(function () {}).then(function () { schedule(250); });
        return;
      }
      loadZXing().then(function (Z) {
        if (!running) return;
        var vw = video.videoWidth, vh = video.videoHeight, code;
        // Alternate the middle band (where the on-screen frame is) and the whole picture.
        if (turn++ % 2 === 0) code = zxDecodeCanvas(Z, frame(canvas, video, vw, vh, 0, Math.round(vh * 0.25), vw, Math.round(vh * 0.5), 1280));
        else code = zxDecodeCanvas(Z, frame(canvas, video, vw, vh, 0, 0, vw, vh, 1024));
        if (code) emit(code);
        schedule(220);
      }, function (err) { running = false; onCode(null, err); });
    }
    tick();
    return function stop() { running = false; clearTimeout(timer); };
  }

  function decodeImage(file) {
    return new Promise(function (ok) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, canvas = document.createElement("canvas");
        var done = function (c) { URL.revokeObjectURL(url); ok(c ? normalize(c) : null); };
        var viaZX = function () {
          loadZXing().then(function (Z) {
            var c = zxDecodeCanvas(Z, frame(canvas, img, w, h, 0, 0, w, h, 1600)) ||
                    zxDecodeCanvas(Z, frame(canvas, img, w, h, 0, Math.round(h * 0.2), w, Math.round(h * 0.6), 1600)) ||
                    zxDecodeCanvas(Z, frame(canvas, img, w, h, 0, 0, w, h, 900));
            done(c);
          }, function () { done(null); });
        };
        if ("BarcodeDetector" in window) {
          new window.BarcodeDetector({ formats: FORMATS }).detect(img).then(function (r) { r && r[0] ? done(r[0].rawValue) : viaZX(); }, viaZX);
        } else viaZX();
      };
      img.onerror = function () { URL.revokeObjectURL(url); ok(null); };
      img.src = url;
    });
  }

  window.FBScan = { start: start, decodeImage: decodeImage, normalize: normalize, loadZXing: loadZXing };
})();

</script>

function examplesFor(kinds, salt){
  const want=kinds.filter(k=>k!=="jighead"), out=[];
  const fits=p=>(want.includes(p[1]) || (want.includes("softgen") && KIND[p[1]].cat==="soft")) && (p[4]==="b"||p[4]===(salt?"s":"f"));
  BRANDS.forEach(b=>b.p.forEach((p,i)=>{ if(fits(p)) out.push({b,p,i}); }));
  if(!out.length) BRANDS.forEach(b=>b.p.forEach((p,i)=>{ if(kinds.includes(p[1]) && (p[4]==="b"||p[4]===(salt?"s":"f"))) out.push({b,p,i}); }));
  return out.slice(0,3);
}

        return `<div style="padding:8px 0;border-top:1px solid var(--line)"><div>${CAT[KIND[c[1]].cat].ic} <b>${esc(n)}</b></div><div class="chips wrap" style="margin-top:6px">${c[2].map(col=>{ const have=findItem(n,col); return `<button class="chip ${have||st.cols.includes(col)?"on":""}" data-n="${esc(n)}" data-col="${esc(col)}" ${have?"disabled title='Already in your box'":""}>${dot(col)}${esc(col)}${have?" ✓":""}</button>`; }).join("")}</div></div>`; }).join("")}</div>
      <button class="btn pri" id="kAdd" style="width:100%;margin-top:12px">Add to my tackle box</button>`;
      $$(".x",s).forEach(b=>b.onclick=()=>s.remove());
      $$("[data-take]",s).forEach(i=>i.onchange=()=>{ sel[i.dataset.take].take=i.checked; });
      $$("[data-n]",s).forEach(b=>b.onclick=()=>{ const st=sel[b.dataset.n], col=b.dataset.col; st.cols=st.cols.includes(col)?st.cols.filter(x=>x!==col):[...st.cols,col]; draw(); });
      $("#kAdd",s).onclick=()=>{ let n=0; k.items.forEach(([name])=>{ const c=COMMON_BY[name], st=sel[name];
          if(!c[2].length){ if(st.take && !findItem(name,"")){ S.items.push(newItem(name,c[1],"")); n++; } }
          else st.cols.forEach(col=>{ if(!findItem(name,col)){ S.items.push(newItem(name,c[1],col)); n++; } }); });
        save(); s.remove(); toast(`${n} items added`); show("tackle"); };
    };
    draw();
  });
}
function itemSheet(it, prefill){
  const isNew=!it; it = it || Object.assign({id:uid(),name:"",kind:"other",brand:"",color:"",size:"",qty:1,low:0,notes:"",barcode:""}, prefill||{});
  if(isNew && prefill && prefill.name && (!prefill.kind || prefill.kind==="other")) it.kind=guessKind(prefill.name);
  const s=sheet(`<div class="top"><h2>${isNew?"New tackle":"Edit tackle"}</h2><button class="x">✕</button></div>
  ${it.barcode?`<p class="small muted" style="margin:0">Barcode ${esc(it.barcode)}</p>`:""}
  <label>Name</label><input id="fName" value="${esc(it.name)}" placeholder="e.g. Gold spoon ½ oz">
  <label>Type</label><select id="fKind">${kindOptions(it.kind)}</select>
  <div class="row"><div><label>Brand</label><input id="fBrand" list="brandList" value="${esc(it.brand)}"><datalist id="brandList">${BRANDS.map(b=>`<option value="${esc(b.n)}">`).join("")}</datalist></div><div><label>Color</label><input id="fColor" value="${esc(it.color)}"></div></div>
  <div class="row"><div><label>Size / weight</label><input id="fSize" value="${esc(it.size)}" placeholder="½ oz, 3/0, 20 lb"></div><div><label>How many</label><input id="fQty" type="number" min="0" inputmode="numeric" value="${it.qty}"></div></div>
  <label>Warn me when I'm down to</label><input id="fLow" type="number" min="0" inputmode="numeric" value="${it.low}">
  <label>Notes</label><textarea id="fNotes" placeholder="Where it works, what it caught">${esc(it.notes)}</textarea>
  <div class="row" style="margin-top:14px">${isNew?"":`<button class="btn bad" id="fDel">Delete</button>`}<button class="btn pri" id="fSave">${isNew?"Add to my box":"Save"}</button></div>`);
  let kindTouched=!isNew;
  $("#fKind",s).onchange=()=>kindTouched=true;
  $("#fName",s).oninput=e=>{ if(!kindTouched){ const g=guessKind(e.target.value); if(g!=="other") $("#fKind",s).value=g; } };
  $("#fSave",s).onclick=()=>{ const name=$("#fName",s).value.trim(); if(!name) return toast("Give it a name");
    Object.assign(it,{name,kind:$("#fKind",s).value,brand:$("#fBrand",s).value.trim(),color:$("#fColor",s).value.trim(),size:$("#fSize",s).value.trim(),qty:Math.max(0,parseInt($("#fQty",s).value)||0),low:Math.max(0,parseInt($("#fLow",s).value)||0),notes:$("#fNotes",s).value.trim()});
    if(isNew) S.items.push(it); save(); s.remove(); toast(isNew?`${name} added`:"Saved"); if(prefill && prefill._done) prefill._done(it); render(); };
  const d=$("#fDel",s); if(d) d.onclick=()=>{ if(!confirmInline(d)) return; S.items=S.items.filter(x=>x.id!==it.id); save(); s.remove(); toast("Deleted"); render(); };
  if(isNew) setTimeout(()=>$("#fName",s).focus(),50);
  return s;
}
function confirmInline(btn){ if(btn.dataset.sure) return true; btn.dataset.sure=1; btn.textContent="Tap again to delete"; setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.sure; btn.textContent="Delete"; } },3000); return false; }

/* ---------- barcode scanner ---------- */
async function lookupUPC(code){
  try{
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(SB_URL+"/functions/v1/tackle-lookup",{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({barcode:code})});
    if(!r.ok) return null; const j=await r.json(); return j&&j.found?j:null;
  }catch(e){ return null; }
}
/* share a product someone named with everyone (shared catalog, by barcode) */
function shareBarcode(it){
  if(!it||!it.barcode||!/^\d{6,14}$/.test(it.barcode)) return;
  fetch(SB_URL+"/functions/v1/tackle-lookup",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({barcode:it.barcode,save:{name:it.name,brand:it.brand,kind:it.kind,color:it.color,size:it.size}})}).catch(()=>{});
}
let scan=null;
async function openScanner(){
  const el=document.createElement("div"); el.id="scanner";
  el.innerHTML=`<video playsinline muted autoplay></video><div class="frame"></div>
  <div class="bar"><div class="row" style="align-items:center"><div class="seg" id="sMode"><button class="on" data-m="add">Bought (+1)</button><button data-m="use">Used (−1)</button></div><button class="btn sm" id="sClose" style="flex:0 0 auto">Done</button></div>
  <div id="sMsg" class="small" style="margin-top:10px">Point the camera at the barcode on the package.</div>
  <div class="row" style="margin-top:10px"><label class="btn sm" style="margin:0">🖼️ Photo of barcode<input type="file" accept="image/*" capture="environment" id="sFile" hidden></label><button class="btn sm" id="sType">⌨️ Type the number</button></div></div>`;
  document.body.appendChild(el);
  let mode="add"; $$("#sMode button",el).forEach(b=>b.onclick=()=>{ mode=b.dataset.m; $$("#sMode button",el).forEach(x=>x.classList.toggle("on",x===b)); });
  const msg=t=>$("#sMsg",el).innerHTML=t;
  let stop=null, busy=false, stream=null;
  const close=()=>{ try{stop&&stop();}catch(e){} if(stream) stream.getTracks().forEach(t=>t.stop()); el.remove(); scan=null; render(); };
  $("#sClose",el).onclick=close;
  async function onCode(raw){
    if(busy) return; const code=FBScan.normalize(raw); busy=true;
    if(navigator.vibrate) navigator.vibrate(60);
    const it=S.items.find(x=>x.barcode===code);
    if(it){ it.qty=Math.max(0,(+it.qty||0)+(mode==="use"?-1:1)); save(); msg(`✓ <b>${esc(it.name)}</b>: now ${it.qty}`); setTimeout(()=>busy=false,1400); return; }
    msg(`Read ${esc(code)}. Looking it up…`);
    const L=await lookupUPC(code);
    const s=itemSheet(null,{barcode:code,name:L?L.name||"":"",brand:L?L.brand||"":"",color:L?L.color||"":"",size:L?L.size||"":"",kind:L?(L.kind||guessKind([L.name,L.title].join(" "))):"other",qty:1,_done:it=>{ shareBarcode(it); msg("Saved. Scan the next one."); }});
    s.style.zIndex=40;
    msg(L?`Found <b>${esc(L.name||code)}</b>${L.source==="catalog"?" in the Tackle Box catalog":""}. Check the details and save.`:`New barcode ${esc(code)}. Fill in what it is, and it's shared so the next person's scan fills in by itself.`);
    const obs=new MutationObserver(()=>{ if(!s.isConnected){ obs.disconnect(); busy=false; if(el.isConnected) msg("Point the camera at the next barcode."); } }); obs.observe(document.body,{childList:true});
  }
  $("#sFile",el).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; msg("Reading the photo…"); try{ const c=await FBScan.decodeImage(f); if(c) onCode(c); else msg("Couldn't find a barcode in that photo. Try closer, with the lines sharp."); }catch(err){ msg(esc(err.message||"Couldn't read that photo.")); } };
  $("#sType",el).onclick=()=>{ const v=prompt("Barcode number (UPC / EAN)"); if(v&&/^\d{6,14}$/.test(v.trim())) onCode(v.trim()); };
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=$("video",el); v.srcObject=stream; await v.play().catch(()=>{});
    stop=await FBScan.start(v,onCode);
  }catch(e){ msg("The camera isn't available here. Use <b>Photo of barcode</b> or <b>Type the number</b> instead."); $(".frame",el).classList.add("hidden"); }
}

/* ---------- Pack ---------- */
const GROUPS=["Inshore","Surf","Nearshore","Offshore","Freshwater","Panfish"];
function recsFor(sp, fly){
  const list = fly ? sp.f : sp.b, lures=[], bait=[];
  list.forEach(txt=>{
    if(fly){ lures.push({txt, kinds:["fly"], fly:true}); return; }
    const art = ARTIFICIAL.test(txt);
    if(NATURAL.test(txt) && !art){ bait.push(txt);
      const gear=kindsFor(txt).filter(k=>["rig","hook","weight"].includes(KIND[k].cat));
      if(gear.length) lures.push({txt:gear.map(k=>KIND[k].name).join(" or ")+" (for "+txt.toLowerCase().replace(/\s*(under|on|with)\s.*$/,"")+")", kinds:gear});
      return; }
    const kinds=kindsFor(txt).filter(k=>k!=="fly");
    lures.push({txt, kinds: kinds.length?kinds:["other"]});
  });
  return {lures, bait};
}
function haveFor(rec){
  const words=rec.txt.toLowerCase().replace(/\(.*?\)/g,"").split(/[^a-z0-9]+/).filter(w=>w.length>3 && !/with|tipped|rigged|small|large|under|live/.test(w));
  return S.items.filter(it=>it.qty>0 && (rec.fly ? itemCat(it)==="fly" && (it.name.toLowerCase().includes(rec.txt.toLowerCase().replace(/\s*\(.*$/,"")) || words.some(w=>it.name.toLowerCase().includes(w)))
    : (rec.kinds.includes(it.kind) || (rec.kinds.includes("softgen") && itemCat(it)==="soft") || (rec.kinds[0]==="other" && words.some(w=>it.name.toLowerCase().includes(w))))));
}
const WATER=[["clear","Clear"],["stained","Stained"],["muddy","Muddy"]], LIGHT=[["bright","Bright sun"],["low","Low light"],["night","Night"]];
function colorSet(sp, fly){ const c=S.cond||{water:"stained",light:"bright"}, table=FRESH_GROUPS.includes(sp.g)?COLOR_FRESH:COLOR_SALT, key=c.light==="night"?"night":`${c.water}-${c.light}`, set=table[key]||table["stained-bright"]; return fly?set.fly:set.pick; }
function condWhy(){ const c=S.cond||{water:"stained",light:"bright"}; return c.light==="night"?"at night":`${c.water} water, ${c.light==="low"?"low light":"bright sun"}`; }
function renderPack(){

  <p class="small muted" style="margin:6px 0 10px">${fly?"Showing flies (switch to Conventional at the top for lures and bait). ":""}Pick one or more fish. Not sure? <a href="https://fishforecast.net" target="_blank" rel="noopener">Fish Bite Forecast</a> shows what's biting at your spot today.</p>
  <div class="search" style="margin-bottom:4px"><input id="pq" placeholder="Find a fish" value="${esc(S.packQ||"")}"></div>
  ${GROUPS.map(g=>{ const sp=SPECIES.filter(s=>s.g===g && (!q||s.n.toLowerCase().includes(q))); return sp.length?`<h3>${g}</h3><div class="chips wrap">${sp.map(s=>`<button class="chip ${S.packSel.includes(s.id)?"on":""}" data-sp="${s.id}">${esc(s.n)}</button>`).join("")}</div>`:""; }).join("")}
  ${chosen.length?`<button class="btn pri" id="pDone2" style="width:100%;margin-top:14px">Show what to pack (${chosen.length})</button>`:""}
  </div>` : `<div class="card"><h2>Packing for</h2><div class="chips wrap">${chosen.map(s=>`<button class="chip on" data-sp="${s.id}">${esc(s.n)} ✕</button>`).join("")}<button class="chip" id="pMore">＋ Add or change fish</button></div>${fly?`<p class="small muted" style="margin:2px 0 0">Showing flies. Switch to Conventional at the top for lures and bait.</p>`:""}</div>`;
  if(chosen.length && !open){
    html+=`<div class="card"><h2>Today's conditions</h2><p class="small muted" style="margin:-2px 0 8px">Colors change with the water and the light. <a href="https://fishforecast.net" target="_blank" rel="noopener">Fish Bite Forecast</a> estimates both for your spot.</p>
    <label style="margin-top:0">Water</label><div class="seg">${WATER.map(([k,l])=>`<button class="${S.cond.water===k?"on":""}" data-water="${k}" ${S.cond.light==="night"?"disabled":""}>${l}</button>`).join("")}</div>
    <label>Light</label><div class="seg">${LIGHT.map(([k,l])=>`<button class="${S.cond.light===k?"on":""}" data-light="${k}">${l}</button>`).join("")}</div></div>`;

  if(chosen.length && !open){

      html+=`<div class="card"><h2>${esc(sp.n)}</h2>
      <div class="small" style="margin:-2px 0 4px"><b>🎨 Best ${fly?"fly":"lure"} colors</b> <span class="muted">(${condWhy()})</span></div>
      <div class="chips wrap">${picks.map(c=>{ const got=lureItems.some(it=>colorMatch(it.color,c)); return `<span class="chip" style="cursor:default${got?";border-color:var(--good)":""}">${dot(c)}${esc(c)}${got?" ✓":""}</span>`; }).join("")}</div>
      ${!fly&&BAIT_FIRST[sp.id]?`<p class="small muted" style="margin:2px 0 0">${esc(sp.n)} are mostly caught on natural bait. Colors matter less than fresh bait on the bottom.</p>`:""}${SPECIES_COLOR[sp.id]?`<p class="small muted" style="margin:4px 0 0">${esc(SPECIES_COLOR[sp.id])}</p>`:""}`;
      if(!r.lures.length && !r.bait.length) html+=`<p class="small muted">${fly?"Not a common fly-rod fish.":"No tackle list for this fish yet."}</p>`;
      if(r.lures.length){ html+=`<h3>${fly?"Flies":"Lures & rigs"}</h3>`+r.lures.map(rec=>{ const have=haveFor(rec); if(!have.length) toBuy.push(rec);
        const slug=rec.fly&&FLYSLUG[rec.txt], gear=["rig","hook","weight","line","term","tool"].includes((KIND[rec.kinds[0]]||KIND.other).cat);
        const judged=have.filter(h=>h.color && !["jighead","cork","carolina","bottomrig","sabiki"].includes(h.kind) && !["rig","hook","weight","line","term","tool"].includes(itemCat(h)));

    html+=`<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Don't forget</h2><button class="btn sm" id="pReset" style="flex:0 0 auto">Reset</button></div>${ESSENTIALS.map((e,i)=>`<label class="chk ${S.packChecks[i]?"done":""}"><input type="checkbox" data-ess="${i}" ${S.packChecks[i]?"checked":""}><span>${esc(e)}</span></label>`).join("")}</div>`;

  $$("[data-sp]",m).forEach(b=>b.onclick=()=>{ if(open) S.pickOpen=true; const id=b.dataset.sp; S.packSel=S.packSel.includes(id)?S.packSel.filter(x=>x!==id):[...S.packSel,id]; save(); renderPack(); });

/* ---------- Shopping ---------- */
function addShop(name, from){ if(S.shop.some(x=>!x.done && x.name.toLowerCase()===name.toLowerCase())) return false; S.shop.push({id:uid(),name,from:from||"",done:false}); save(); return true; }
function shopList(){
  const low=S.items.filter(isLow).map(it=>({id:"low:"+it.id,name:it.name,low:it,done:false}));
  return [...low,...S.shop];
}
function renderShop(){
  const m=$("#main"), list=shopList(), todo=list.filter(x=>!x.done), done=S.shop.filter(x=>x.done);
  const row=x=>`<div class="item"><div class="ic">${x.low?"⚠️":"🛒"}</div><div class="nm"><b>${esc(x.name)}</b><span>${x.low?`${x.low.qty>0?`Down to ${x.low.qty}`:"Out"} · from your box`:x.from==="Pack"?"Missing for your trip":"Added by you"}</span></div>
    <a class="btn sm" href="${shopUrl(x.name)}" target="_blank" rel="noopener">Shop</a><button class="btn sm pri" data-got="${x.id}">Got it</button></div>`;
  m.innerHTML=`<div class="card"><h2>Shopping list</h2>${todo.length?todo.map(row).join(""):`<p class="muted small" style="margin:0">Nothing to buy. Items you run low on, and anything missing for a trip, show up here.</p>`}
  <div class="row" style="margin-top:12px"><input id="sAdd" placeholder="Add something (e.g. 30 lb leader)"><button class="btn" id="sAddB" style="flex:0 0 auto">Add</button></div></div>
  <div class="card"><h2>My tackle shop</h2><p class="small muted" style="margin-top:0">So you can call ahead for live bait or anything you're missing.</p>
  <div class="row"><div><label>Shop name</label><input id="shN" value="${esc(S.settings.shopName||"")}" placeholder="e.g. Strike Zone Fishing"></div><div><label>Phone</label><input id="shP" type="tel" value="${esc(S.settings.shopPhone||"")}"></div></div>
  ${S.settings.shopPhone?`<a class="btn" style="margin-top:10px;width:100%" href="tel:${esc(S.settings.shopPhone)}">📞 Call ${esc(S.settings.shopName||"my shop")}</a>`:""}</div>
  ${done.length?`<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Bought</h2><button class="btn sm" id="sClear" style="flex:0 0 auto">Clear</button></div>${done.map(x=>`<div class="item"><div class="ic">✅</div><div class="nm"><b style="color:var(--muted)">${esc(x.name)}</b></div></div>`).join("")}</div>`:""}`;
  $$("[data-got]",m).forEach(b=>b.onclick=()=>gotIt(b.dataset.got));
  const add=()=>{ const v=$("#sAdd").value.trim(); if(!v) return; addShop(v,"me"); renderShop(); };
  $("#sAddB").onclick=add; $("#sAdd").onkeydown=e=>{ if(e.key==="Enter") add(); };
  $("#shN").onchange=e=>{ S.settings.shopName=e.target.value.trim(); save(); renderShop(); };
  $("#shP").onchange=e=>{ S.settings.shopPhone=e.target.value.trim(); save(); renderShop(); };
  const c=$("#sClear"); if(c) c.onclick=()=>{ S.shop=S.shop.filter(x=>!x.done); save(); renderShop(); };
}
function gotIt(id){
  if(id.startsWith("low:")){ const it=S.items.find(x=>x.id===id.slice(4)); const s=sheet(`<div class="top"><h2>Restock ${esc(it.name)}</h2><button class="x">✕</button></div><label>How many did you buy?</label><input id="gN" type="number" min="1" inputmode="numeric" value="${Math.max(1,(it.low||1)*2)}"><button class="btn pri" id="gOk" style="width:100%;margin-top:12px">Add to my box</button>`);
    $("#gOk",s).onclick=()=>{ it.qty=(+it.qty||0)+Math.max(1,parseInt($("#gN",s).value)||1); save(); s.remove(); toast(`${it.name}: now ${it.qty}`); renderShop(); }; return; }
  const x=S.shop.find(y=>y.id===id); x.done=true; save(); renderShop();
  const s=sheet(`<div class="top"><h2>Add it to your box?</h2><button class="x">✕</button></div><p class="muted" style="margin-top:0">${esc(x.name)}</p><div class="row"><button class="btn" id="gNo">Not now</button><button class="btn pri" id="gYes">Add to my box</button></div>`);
  $("#gNo",s).onclick=()=>s.remove();
  $("#gYes",s).onclick=()=>{ s.remove(); itemSheet(null,{name:x.name,kind:guessKind(x.name)}); };
}

/* ---------- More ---------- */
function drawFlySeg(){ $$("#flyseg button").forEach(b=>{ b.classList.toggle("on",(b.dataset.fly==="1")===!!S.packFly); b.onclick=()=>{ S.packFly=b.dataset.fly==="1"; save(); render(); }; }); }
function renderSettings(){
  const m=$("#main");
  m.innerHTML=`<div class="card"><h2>Tie &amp; Tide apps</h2>
  <a class="linkcard" href="https://fishforecast.net" target="_blank" rel="noopener"><div class="appic" style="background:#0f3b3a">🐟</div><div class="nm"><b>Fish Bite Forecast</b><span>Know when they're biting: bite scores, tides and the best lure for today</span></div></a>
  <a class="linkcard" href="https://app.flytyingrecipes.org" target="_blank" rel="noopener"><div class="appic" style="background:#26305a">🪰</div><div class="nm"><b>Fly Bench</b><span>Tie it. Fish it. Log it. 1,200+ fly recipes sorted by fish</span></div></a></div>
  <div class="card"><h2>Lure makers</h2><p class="small muted" style="margin-top:0">${BRANDS.length} makers, who owns them, and their best-known lures with sizes and popular colors.</p><button class="btn" id="mBrands" style="width:100%">🏷️ Browse lure makers</button></div>
  <div class="card"><h2>Back up your tackle</h2><p class="small muted" style="margin-top:0">Your tackle is saved on this phone. Download a backup, or a spreadsheet of everything you own.</p>
  <div class="grid2"><button class="btn" id="mJson">⬇️ Backup file</button><button class="btn" id="mCsv">📄 Spreadsheet (CSV)</button></div>
  <label class="btn" style="width:100%;margin-top:8px">⬆️ Restore a backup<input type="file" accept="application/json,.json" id="mRestore" hidden></label></div>
  <div class="card"><h2>About</h2><p class="small muted" style="margin:0">Tackle Box by Tie &amp; Tide. Lure suggestions come from Fish Bite Forecast's species guides. Always check your state's fishing rules before you keep a fish.</p>
  <button class="btn bad" id="mWipe" style="margin-top:12px;width:100%">Delete everything on this phone</button></div>`;
  $("#mBrands").onclick=brandsSheet;
  const dl=(name,type,text)=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); };
  $("#mJson").onclick=()=>dl("tackle-box-backup.json","application/json",JSON.stringify(S,null,1));
  $("#mCsv").onclick=()=>{ const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`; dl("my-tackle.csv","text/csv",["Name,Type,Category,Brand,Color,Size,Qty,Warn at,Barcode,Notes",...S.items.map(it=>[it.name,(KIND[it.kind]||KIND.other).name,CAT[itemCat(it)].name,it.brand,it.color,it.size,it.qty,it.low,it.barcode||"",it.notes].map(q).join(","))].join("\n")); };
  $("#mRestore").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(!j.items) throw 0; S=Object.assign(load(),j); save(); toast("Backup restored"); show("tackle"); }catch(err){ toast("That isn't a Tackle Box backup file"); } };
  $("#mWipe").onclick=e=>{ const b=e.target; if(!b.dataset.sure){ b.dataset.sure=1; b.textContent="Tap again to delete all your tackle"; return; } S={items:[],shop:[],packChecks:{},packSel:[],packFly:false,settings:{}}; save(); toast("Deleted"); show("tackle"); };
}

render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
