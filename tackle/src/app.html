function examplesFor(kinds, salt){
  const want=kinds.filter(k=>k!=="jighead"), out=[];
  const fits=p=>(want.includes(p[1]) || (want.includes("softgen") && KIND[p[1]].cat==="soft")) && (p[4]==="b"||p[4]===(salt?"s":"f"));
  BRANDS.forEach(b=>b.p.forEach((p,i)=>{ if(fits(p)) out.push({b,p,i}); }));
  if(!out.length) BRANDS.forEach(b=>b.p.forEach((p,i)=>{ if(kinds.includes(p[1]) && (p[4]==="b"||p[4]===(salt?"s":"f"))) out.push({b,p,i}); }));
  return out.slice(0,3);
}

function confirmInline(btn){ if(btn.dataset.sure) return true; btn.dataset.sure=1; btn.textContent="Tap again to delete"; setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.sure; btn.textContent="Delete"; } },3000); return false; }

/* ---------- barcode scanner ---------- */
async function lookupUPC(code){
  try{
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(SB_URL+"/functions/v1/tackle-lookup",{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({barcode:code})});
    if(!r.ok) return null; const j=await r.json(); return j&&j.found?j:null;
  }catch(e){ return null; }
}
/* share a product someone named with everyone (shared catalog, by barcode) */
function shareBarcode(it){
  if(!it||!it.barcode||!/^\d{6,14}$/.test(it.barcode)) return;
  fetch(SB_URL+"/functions/v1/tackle-lookup",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({barcode:it.barcode,save:{name:it.name,brand:it.brand,kind:it.kind,color:it.color,size:it.size}})}).catch(()=>{});
}
let scan=null;
async function openScanner(){
  const el=document.createElement("div"); el.id="scanner";
  el.innerHTML=`<video playsinline muted autoplay></video><div class="frame"></div>
  <div class="bar"><div class="row" style="align-items:center"><div class="seg" id="sMode"><button class="on" data-m="add">Bought (+1)</button><button data-m="use">Used (−1)</button></div><button class="btn sm" id="sClose" style="flex:0 0 auto">Done</button></div>
  <div id="sMsg" class="small" style="margin-top:10px">Point the camera at the barcode on the package.</div>
  <div class="row" style="margin-top:10px"><label class="btn sm" style="margin:0">🖼️ Photo of barcode<input type="file" accept="image/*" capture="environment" id="sFile" hidden></label><button class="btn sm" id="sType">⌨️ Type the number</button></div></div>`;
  document.body.appendChild(el);
  let mode="add"; $$("#sMode button",el).forEach(b=>b.onclick=()=>{ mode=b.dataset.m; $$("#sMode button",el).forEach(x=>x.classList.toggle("on",x===b)); });
  const msg=t=>$("#sMsg",el).innerHTML=t;
  let stop=null, busy=false, stream=null;
  const close=()=>{ try{stop&&stop();}catch(e){} if(stream) stream.getTracks().forEach(t=>t.stop()); el.remove(); scan=null; render(); };
  $("#sClose",el).onclick=close;
  async function onCode(raw){
    if(busy) return; const code=FBScan.normalize(raw); busy=true;
    if(navigator.vibrate) navigator.vibrate(60);
    const it=S.items.find(x=>x.barcode===code);
    if(it){ it.qty=Math.max(0,(+it.qty||0)+(mode==="use"?-1:1)); save(); msg(`✓ <b>${esc(it.name)}</b>: now ${it.qty}`); setTimeout(()=>busy=false,1400); return; }
    msg(`Read ${esc(code)}. Looking it up…`);
    const L=await lookupUPC(code);
    const s=itemSheet(null,{barcode:code,name:L?L.name||"":"",brand:L?L.brand||"":"",color:L?L.color||"":"",size:L?L.size||"":"",kind:L?(L.kind||guessKind([L.name,L.title].join(" "))):"other",qty:1,_done:it=>{ shareBarcode(it); msg("Saved. Scan the next one."); }});
    s.style.zIndex=40;
    msg(L?`Found <b>${esc(L.name||code)}</b>${L.source==="catalog"?" in the Tackle Box catalog":""}. Check the details and save.`:`New barcode ${esc(code)}. Fill in what it is, and it's shared so the next person's scan fills in by itself.`);
    const obs=new MutationObserver(()=>{ if(!s.isConnected){ obs.disconnect(); busy=false; if(el.isConnected) msg("Point the camera at the next barcode."); } }); obs.observe(document.body,{childList:true});
  }
  $("#sFile",el).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; msg("Reading the photo…"); try{ const c=await FBScan.decodeImage(f); if(c) onCode(c); else msg("Couldn't find a barcode in that photo. Try closer, with the lines sharp."); }catch(err){ msg(esc(err.message||"Couldn't read that photo.")); } };
  $("#sType",el).onclick=()=>{ const v=prompt("Barcode number (UPC / EAN)"); if(v&&/^\d{6,14}$/.test(v.trim())) onCode(v.trim()); };
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=$("video",el); v.srcObject=stream; await v.play().catch(()=>{});
    stop=await FBScan.start(v,onCode);
  }catch(e){ msg("The camera isn't available here. Use <b>Photo of barcode</b> or <b>Type the number</b> instead."); $(".frame",el).classList.add("hidden"); }
}

/* ---------- Pack ---------- */
const GROUPS=["Inshore","Surf","Nearshore","Offshore","Freshwater","Panfish"];
function recsFor(sp, fly){
  const list = fly ? sp.f : sp.b, lures=[], bait=[];
  list.forEach(txt=>{
    if(fly){ lures.push({txt, kinds:["fly"], fly:true}); return; }
    const art = ARTIFICIAL.test(txt);
    if(NATURAL.test(txt) && !art){ bait.push(txt);
      const gear=kindsFor(txt).filter(k=>["rig","hook","weight"].includes(KIND[k].cat));
      if(gear.length) lures.push({txt:gear.map(k=>KIND[k].name).join(" or ")+" (for "+txt.toLowerCase().replace(/\s*(under|on|with)\s.*$/,"")+")", kinds:gear});
      return; }
    const kinds=kindsFor(txt).filter(k=>k!=="fly");
    lures.push({txt, kinds: kinds.length?kinds:["other"]});
  });
  return {lures, bait};
}
function haveFor(rec){
  const words=rec.txt.toLowerCase().replace(/\(.*?\)/g,"").split(/[^a-z0-9]+/).filter(w=>w.length>3 && !/with|tipped|rigged|small|large|under|live/.test(w));
  return S.items.filter(it=>it.qty>0 && (rec.fly ? itemCat(it)==="fly" && (it.name.toLowerCase().includes(rec.txt.toLowerCase().replace(/\s*\(.*$/,"")) || words.some(w=>it.name.toLowerCase().includes(w)))
    : (rec.kinds.includes(it.kind) || (rec.kinds.includes("softgen") && itemCat(it)==="soft") || (rec.kinds[0]==="other" && words.some(w=>it.name.toLowerCase().includes(w))))));
}
const WATER=[["clear","Clear"],["stained","Stained"],["muddy","Muddy"]], LIGHT=[["bright","Bright sun"],["low","Low light"],["night","Night"]];
function colorSet(sp, fly){ const c=S.cond||{water:"stained",light:"bright"}, table=FRESH_GROUPS.includes(sp.g)?COLOR_FRESH:COLOR_SALT, key=c.light==="night"?"night":`${c.water}-${c.light}`, set=table[key]||table["stained-bright"]; return fly?set.fly:set.pick; }
function condWhy(){ const c=S.cond||{water:"stained",light:"bright"}; return c.light==="night"?"at night":`${c.water} water, ${c.light==="low"?"low light":"bright sun"}`; }

  $$("[data-sp]",m).forEach(b=>b.onclick=()=>{ if(open) S.pickOpen=true; const id=b.dataset.sp; S.packSel=S.packSel.includes(id)?S.packSel.filter(x=>x!==id):[...S.packSel,id]; save(); renderPack(); });
  const pm=$("#pMore"); if(pm) pm.onclick=()=>{ S.pickOpen=true; save(); renderPack(); };
  $$("#pDone,#pDone2").forEach(b=>b.onclick=()=>{ S.pickOpen=false; save(); renderPack(); window.scrollTo(0,0); });
  const pd=null; if(pd) pd.onclick=()=>{ S.pickOpen=false; save(); renderPack(); window.scrollTo(0,0); };
  if($("#pq")) $("#pq").oninput=e=>{ S.packQ=e.target.value; const pos=e.target.selectionStart; renderPack(); const i=$("#pq"); i.focus(); i.setSelectionRange(pos,pos); };
  $$("[data-ex]",m).forEach(a=>a.onclick=e=>{ e.preventDefault(); const [bid,i]=a.dataset.ex.split("|"); const b=BRAND[bid]; productSheet(b,b.p[+i],()=>renderPack()); });
  $$("[data-water]",m).forEach(b=>b.onclick=()=>{ S.cond.water=b.dataset.water; save(); renderPack(); });
  $$("[data-light]",m).forEach(b=>b.onclick=()=>{ S.cond.light=b.dataset.light; save(); renderPack(); });
  $$("[data-buy]",m).forEach(b=>b.onclick=()=>{ toast(addShop(b.dataset.buy,"Pack")?"Added to your shopping list":"Already on your list"); renderPack(); });
  $$("[data-ess]",m).forEach(c=>c.onchange=()=>{ S.packChecks[c.dataset.ess]=c.checked; save(); c.closest(".chk").classList.toggle("done",c.checked); });
  const pr=$("#pReset"); if(pr) pr.onclick=()=>{ S.packChecks={}; save(); renderPack(); };
}

/* ---------- Shopping ---------- */
function addShop(name, from){ if(S.shop.some(x=>!x.done && x.name.toLowerCase()===name.toLowerCase())) return false; S.shop.push({id:uid(),name,from:from||"",done:false}); save(); return true; }
function shopList(){
  const low=S.items.filter(isLow).map(it=>({id:"low:"+it.id,name:it.name,low:it,done:false}));
  return [...low,...S.shop];
}
function renderShop(){
  const m=$("#main"), list=shopList(), todo=list.filter(x=>!x.done), done=S.shop.filter(x=>x.done);
  const row=x=>`<div class="item"><div class="ic">${x.low?"⚠️":"🛒"}</div><div class="nm"><b>${esc(x.name)}</b><span>${x.low?`${x.low.qty>0?`Down to ${x.low.qty}`:"Out"} · from your box`:x.from==="Pack"?"Missing for your trip":"Added by you"}</span></div>
    <a class="btn sm" href="${shopUrl(x.name)}" target="_blank" rel="noopener">Shop</a><button class="btn sm pri" data-got="${x.id}">Got it</button></div>`;
  m.innerHTML=`<div class="card"><h2>Shopping list</h2>${todo.length?todo.map(row).join(""):`<p class="muted small" style="margin:0">Nothing to buy. Items you run low on, and anything missing for a trip, show up here.</p>`}
  <div class="row" style="margin-top:12px"><input id="sAdd" placeholder="Add something (e.g. 30 lb leader)"><button class="btn" id="sAddB" style="flex:0 0 auto">Add</button></div></div>
  <div class="card"><h2>My tackle shop</h2><p class="small muted" style="margin-top:0">So you can call ahead for live bait or anything you're missing.</p>
  <div class="row"><div><label>Shop name</label><input id="shN" value="${esc(S.settings.shopName||"")}" placeholder="e.g. Strike Zone Fishing"></div><div><label>Phone</label><input id="shP" type="tel" value="${esc(S.settings.shopPhone||"")}"></div></div>
  ${S.settings.shopPhone?`<a class="btn" style="margin-top:10px;width:100%" href="tel:${esc(S.settings.shopPhone)}">📞 Call ${esc(S.settings.shopName||"my shop")}</a>`:""}</div>
  ${done.length?`<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Bought</h2><button class="btn sm" id="sClear" style="flex:0 0 auto">Clear</button></div>${done.map(x=>`<div class="item"><div class="ic">✅</div><div class="nm"><b style="color:var(--muted)">${esc(x.name)}</b></div></div>`).join("")}</div>`:""}`;
  $$("[data-got]",m).forEach(b=>b.onclick=()=>gotIt(b.dataset.got));
  const add=()=>{ const v=$("#sAdd").value.trim(); if(!v) return; addShop(v,"me"); renderShop(); };
  $("#sAddB").onclick=add; $("#sAdd").onkeydown=e=>{ if(e.key==="Enter") add(); };
  $("#shN").onchange=e=>{ S.settings.shopName=e.target.value.trim(); save(); renderShop(); };
  $("#shP").onchange=e=>{ S.settings.shopPhone=e.target.value.trim(); save(); renderShop(); };
  const c=$("#sClear"); if(c) c.onclick=()=>{ S.shop=S.shop.filter(x=>!x.done); save(); renderShop(); };
}
function gotIt(id){
  if(id.startsWith("low:")){ const it=S.items.find(x=>x.id===id.slice(4)); const s=sheet(`<div class="top"><h2>Restock ${esc(it.name)}</h2><button class="x">✕</button></div><label>How many did you buy?</label><input id="gN" type="number" min="1" inputmode="numeric" value="${Math.max(1,(it.low||1)*2)}"><button class="btn pri" id="gOk" style="width:100%;margin-top:12px">Add to my box</button>`);
    $("#gOk",s).onclick=()=>{ it.qty=(+it.qty||0)+Math.max(1,parseInt($("#gN",s).value)||1); save(); s.remove(); toast(`${it.name}: now ${it.qty}`); renderShop(); }; return; }
  const x=S.shop.find(y=>y.id===id); x.done=true; save(); renderShop();
  const s=sheet(`<div class="top"><h2>Add it to your box?</h2><button class="x">✕</button></div><p class="muted" style="margin-top:0">${esc(x.name)}</p><div class="row"><button class="btn" id="gNo">Not now</button><button class="btn pri" id="gYes">Add to my box</button></div>`);
  $("#gNo",s).onclick=()=>s.remove();
  $("#gYes",s).onclick=()=>{ s.remove(); itemSheet(null,{name:x.name,kind:guessKind(x.name)}); };
}

/* ---------- More ---------- */
function drawFlySeg(){ $$("#flyseg button").forEach(b=>{ b.classList.toggle("on",(b.dataset.fly==="1")===!!S.packFly); b.onclick=()=>{ S.packFly=b.dataset.fly==="1"; save(); render(); }; }); }
function renderSettings(){
  const m=$("#main");
  m.innerHTML=`<div class="card"><h2>Tie &amp; Tide apps</h2>
  <a class="linkcard" href="https://fishforecast.net" target="_blank" rel="noopener"><div class="appic" style="background:#0f3b3a">🐟</div><div class="nm"><b>Fish Bite Forecast</b><span>Know when they're biting: bite scores, tides and the best lure for today</span></div></a>
  <a class="linkcard" href="https://app.flytyingrecipes.org" target="_blank" rel="noopener"><div class="appic" style="background:#26305a">🪰</div><div class="nm"><b>Fly Bench</b><span>Tie it. Fish it. Log it. 1,200+ fly recipes sorted by fish</span></div></a></div>
  <div class="card"><h2>Lure makers</h2><p class="small muted" style="margin-top:0">${BRANDS.length} makers, who owns them, and their best-known lures with sizes and popular colors.</p><button class="btn" id="mBrands" style="width:100%">🏷️ Browse lure makers</button></div>
  <div class="card"><h2>Back up your tackle</h2><p class="small muted" style="margin-top:0">Your tackle is saved on this phone. Download a backup, or a spreadsheet of everything you own.</p>
  <div class="grid2"><button class="btn" id="mJson">⬇️ Backup file</button><button class="btn" id="mCsv">📄 Spreadsheet (CSV)</button></div>
  <label class="btn" style="width:100%;margin-top:8px">⬆️ Restore a backup<input type="file" accept="application/json,.json" id="mRestore" hidden></label></div>
  <div class="card"><h2>About</h2><p class="small muted" style="margin:0">Tackle Box by Tie &amp; Tide. Lure suggestions come from Fish Bite Forecast's species guides. Always check your state's fishing rules before you keep a fish.</p>
  <button class="btn bad" id="mWipe" style="margin-top:12px;width:100%">Delete everything on this phone</button></div>`;
  $("#mBrands").onclick=brandsSheet;
  const dl=(name,type,text)=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); };
  $("#mJson").onclick=()=>dl("tackle-box-backup.json","application/json",JSON.stringify(S,null,1));
  $("#mCsv").onclick=()=>{ const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`; dl("my-tackle.csv","text/csv",["Name,Type,Category,Brand,Color,Size,Qty,Warn at,Barcode,Notes",...S.items.map(it=>[it.name,(KIND[it.kind]||KIND.other).name,CAT[itemCat(it)].name,it.brand,it.color,it.size,it.qty,it.low,it.barcode||"",it.notes].map(q).join(","))].join("\n")); };
  $("#mRestore").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(!j.items) throw 0; S=Object.assign(load(),j); save(); toast("Backup restored"); show("tackle"); }catch(err){ toast("That isn't a Tackle Box backup file"); } };
  $("#mWipe").onclick=e=>{ const b=e.target; if(!b.dataset.sure){ b.dataset.sure=1; b.textContent="Tap again to delete all your tackle"; return; } S={items:[],shop:[],packChecks:{},packSel:[],packFly:false,settings:{}}; save(); toast("Deleted"); show("tackle"); };
}

render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
