<style>:root{--bg:#0b1a24;--panel:#11263a;--panel2:#16304a;--line:#24435f;--text:#e8f0f6;--muted:#93a9bb;--accent:#3fd0b5;--accent2:#f2b84b;--tide:#3b8fd9;--bad:#e86a5c;--good:#66d17a;--r:14px}

.s0{background:#5c6e7c;color:#dfe7ee}.s1{background:#8aa0b2}.s2{background:var(--accent2)}.s3{background:#7fd88e}.s4{background:var(--accent)}

.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0}

ul.ls{margin:4px 0 0;padding-left:18px}ul.ls li{margin:2px 0}

.btn{border:0;border-radius:11px;padding:11px 14px;font:700 15px inherit;font-family:inherit;background:var(--accent);color:#06221c;width:100%}

.sheet.on{display:flex}
.sheet .in{background:var(--panel);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}

.catch:first-child{border-top:0}

.catch .tx{flex:1;min-width:0}
.bars .b{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}

a{color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin:3px 4px 3px 0;font-size:13px;color:var(--text);font-family:inherit}
.chip.on{background:var(--accent);color:#06221c;border-color:var(--accent);font-weight:700}
.spotrow{border-top:1px solid var(--line);padding:10px 0}
.spotrow .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hide{display:none!important}

.banner .scene{width:100%;height:100%;display:block}

.fish{display:block;flex:0 0 auto;overflow:visible}
.pick .thumb{margin:-6px 0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.spart{margin:-8px 2px -8px -4px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.catch .ic.art{width:64px;height:44px;background:linear-gradient(#1b3e57,#12283a);position:relative;overflow:hidden}
.catch .ic.art .fish{margin:0 auto}
.catch .ic .cnt{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:800;background:var(--accent);color:#06221c;border-radius:6px;padding:0 4px}
#logo{display:flex}#logo svg{display:block}
h1{white-space:nowrap;min-width:0}h1 small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{overflow-x:auto;margin:8px -4px 0}.wk table{border-collapse:separate;border-spacing:3px;width:100%;min-width:430px}
.wk th{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.25}.wk th b{color:var(--text);font-size:13px}
.wk td{text-align:center;padding:0}.wk .wsp{text-align:left;font-size:12px;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px}
.wk .wc{width:100%;min-width:38px;height:34px;border:0;font:800 13px inherit;font-family:inherit;position:relative;border-radius:8px;cursor:pointer}
.wk .wc i{position:absolute;right:1px;top:-3px;font-style:normal;font-size:10px}.wk .wc.top{outline:2px solid var(--accent2);outline-offset:1px}.wk .wc.cur{box-shadow:inset 0 0 0 2px #fff}
.wk .none{color:var(--muted)}
.bell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;height:30px;width:34px;margin-right:6px;font-size:15px;cursor:pointer}
.flyrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;margin:8px 0 2px}.flyrow .small{margin-right:6px}
.flyitem{padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.flyitem:first-of-type{border-top:0}
.need{color:var(--accent2);font-size:11px;font-weight:700}.ok{color:var(--good);font-weight:800}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px}.chk input{width:auto;margin-top:2px}
.sw{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:999px;transition:.2s}
.sw span:before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--accent)}.sw input:checked+span:before{transform:translateX(18px);background:#06221c}
a.btn{display:inline-block;text-align:center;text-decoration:none;box-sizing:border-box}
.row a.btn{flex:1}
.fwline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:6px 0 2px}.fwline select{width:auto;padding:4px 8px;font-size:12px;margin-left:auto}
.fc-verdict{margin-top:8px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:14px}.fc-verdict.good{background:rgba(63,208,181,.15);color:var(--accent)}.fc-verdict.ok{background:rgba(242,184,75,.14);color:var(--accent2)}.fc-verdict.poor{background:rgba(224,122,74,.15);color:#f0a07a}
.mapcard{padding:10px}.maptools{flex-wrap:wrap;align-items:center;gap:4px 12px;margin-bottom:8px}.maptools .chk{margin:0}.maptools select{width:auto;flex:1;min-width:130px}
#leafmap{height:62vh;min-height:340px;border-radius:12px;overflow:hidden;background:#0d2230}
.mpinwrap{background:none;border:0}.mpin{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 12px system-ui;color:#06221c;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.cpin{width:40px;height:22px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}.cpin.approx{opacity:.7}
.leaflet-popup-content{font:13px system-ui;color:#123}.leaflet-popup-content .btn{color:#06221c}
.cphoto{width:64px;height:48px;object-fit:cover;border-radius:8px;flex:0 0 auto;margin-right:8px;cursor:pointer}
.photofield{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.photofield img{width:96px;height:72px;object-fit:cover;border-radius:8px}.filebtn{cursor:pointer;display:inline-block}
nav button{min-width:0}
.minimap{height:240px;border-radius:12px;overflow:hidden;margin-top:6px;background:#0d2230}.dpin{font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.kvrows{display:grid;gap:6px}.kvrows>div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}.kvrows b{text-align:right;font-weight:600}
.colorbox{margin-top:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line,rgba(255,255,255,.1))}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px}
.cchip i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.35);display:inline-block}
.trtext{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;background:rgba(255,255,255,.05);padding:10px;border-radius:10px;margin:8px 0;max-height:46vh;overflow:auto}
.trphotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.crpost{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.crthumb{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.code{letter-spacing:2px;font-family:ui-monospace,Menlo,monospace}
.kvrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.rpin{width:24px;height:24px;border-radius:50%;background:#fff;color:#123;display:grid;place-items:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.featrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid rgba(255,255,255,.07);margin:0;font-weight:400}
.featrow input{width:auto;margin-top:3px}.featrow span{display:flex;flex-direction:column}
.featprompt{border-color:var(--accent)}

.ytbox{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin:10px 0 4px;cursor:pointer}.ytbox img,.ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}.ytplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:40px;border-radius:12px;background:rgba(200,0,0,.9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.gearrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.gearrow:last-of-type{border-bottom:0}.gearbuy{flex:none;padding:7px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--accent);font-weight:700;font-size:13px;text-decoration:none}
h1{overflow:hidden;text-overflow:ellipsis}.seg{flex:none}
@media (max-width:400px){h1{font-size:16px}.seg button{padding-left:9px;padding-right:9px}}
.howfish .chip,.howfish button.chip{margin:4px 4px 0 0}
.howfish .chip.on{background:var(--accent);color:#06222a}
.installcard{border-color:var(--accent)}
.instep{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.instep>span{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#06222a;display:grid;place-items:center;font-weight:700;flex:0 0 auto}
</style></head>
<body>

<script>const WEB_BUILD=true;
// Shared tide engine: astronomical arguments + nodal factors (Schureman), harmonic sum.
(function (root) {
  const D = Math.PI / 180;
  function astro(ms) {
    const jd = ms / 86400000 + 2440587.5;
    const Tc = (jd - 2451545.0) / 36525;
    const s = 218.3165 + 481267.8813 * Tc;
    const h = 280.4661 + 36000.7698 * Tc;
    const p = 83.3535 + 4069.0137 * Tc;
    const N = 125.0445 - 1934.1363 * Tc;
    const T = 180 + 360 * (((jd + 0.5) % 1 + 1) % 1);
    return { s, h, p, N, T };
  }
  function nodal(N) {
    const n = N * D, c = Math.cos, sn = Math.sin;
    return {
      M2: [1.0004 - 0.0373 * c(n) + 0.0002 * c(2 * n), -2.14 * sn(n)],
      O1: [1.0089 + 0.1871 * c(n) - 0.0147 * c(2 * n), 10.80 * sn(n) - 1.34 * sn(2 * n)],
      K1: [1.0060 + 0.1150 * c(n) - 0.0088 * c(2 * n), -8.86 * sn(n) + 0.68 * sn(2 * n)],
      K2: [1.0241 + 0.2863 * c(n) + 0.0083 * c(2 * n), -17.74 * sn(n) + 0.68 * sn(2 * n)],
      ONE: [1, 0],
    };
  }
  // Each constituent: speed (deg/hr), V(a) and nodal [f,u]
  const CONS = {
    M2: { w: 28.9841042, V: a => 2 * a.T - 2 * a.s + 2 * a.h, n: f => f.M2 },
    S2: { w: 30.0, V: a => 2 * a.T, n: f => f.ONE },
    N2: { w: 28.4397295, V: a => 2 * a.T - 3 * a.s + 2 * a.h + a.p, n: f => f.M2 },
    K2: { w: 30.0821373, V: a => 2 * a.T + 2 * a.h, n: f => f.K2 },
    K1: { w: 15.0410686, V: a => a.T + a.h - 90, n: f => f.K1 },
    O1: { w: 13.9430356, V: a => a.T - 2 * a.s + a.h + 90, n: f => f.O1 },
    P1: { w: 14.9589314, V: a => a.T - a.h + 90, n: f => f.ONE },
    Q1: { w: 13.3986609, V: a => a.T - 3 * a.s + a.h + a.p + 90, n: f => f.O1 },
    N2b: null,
    '2N2': { w: 27.8953548, V: a => 2 * a.T - 4 * a.s + 2 * a.h + 2 * a.p, n: f => f.M2 },
    NU2: { w: 28.5125831, V: a => 2 * a.T - 3 * a.s + 4 * a.h - a.p, n: f => f.M2 },
    L2: { w: 29.5284789, V: a => 2 * a.T - a.s + 2 * a.h - a.p + 180, n: f => f.M2 },

function regionOf(lat, lng, water) {
  if (water === 'fresh') return 'FW';
  if (water === 'greatlakes') return 'GL';
  if (lng < -150 && lat < 23) return 'HI';
  if (lat > 51 || lng < -130) return 'AK';
  if (lng < -114) return lat < 34.5 ? 'PS' : 'PN';
  if (lat < 31 && lng < -81.9 && lng > -98) return 'GULF';
  if (lat < 27.5) return 'SF';
  if (lat < 35) return 'SA';
  if (lat < 40.5) return 'MA';
  return 'NE';
}

// Season factor by region; Jacksonville-built species reuse their curve in the South Atlantic and Gulf.
function seasonFactor(sp, region, month) {
  if (sp.seasons && sp.seasons[region]) return sp.seasons[region][month] / 10;
  if (sp.season && (region === 'SA' || region === 'GULF' || region === 'SF')) return Math.max(.3, sp.season[month] / 10);
  return 0.85; // let water temperature decide
}
function speciesFits(sp, spot) {
  if (!sp.waters.includes(spot.water)) return false;
  const lat = spot.lat, lng = spot.lng;
  if (spot.water === 'fresh' || spot.water === 'greatlakes') {
    if (spot.water === 'greatlakes' && !['smallmouth', 'walleye', 'perch', 'pike', 'musky', 'rainbow', 'brown', 'laketrout', 'salmongl', 'whitebass', 'carp'].includes(sp.id)) return false;
    if (sp.lat && lat != null && (lat < sp.lat[0] || lat > sp.lat[1])) return false;
    if (sp.id === 'shad' && lng != null && lng > -117 && lng < -84) return false; // coastal rivers only
    if (sp.regions && !sp.regions.includes(regionOf(lat, lng, 'inshore'))) return false; // e.g. Pacific salmon rivers
    return true;
  }
  const reg = regionOf(lat, lng, spot.water);
  if (sp.regions && !sp.regions.includes(reg)) return false;
  if (sp.latMax && lat > sp.latMax) return false;
  if (sp.id === 'striper' && reg === 'PN' && lat > 44) return false; // West Coast stripers: SF Bay to Oregon
  if (!sp.regions) return false;
  return true;
}

function seClosed(rule, t, sp) {
  if (!rule || !rule.closed) return null;
  if (rule.latMax && sp && sp.lat != null && sp.lat > rule.latMax) return null;
  const d = new Date(t), md = (d.getMonth() + 1) * 100 + d.getDate();
  for (const [sm, sd, em, ed] of rule.closed) {
    const a = sm * 100 + sd, b = em * 100 + ed;
    if (a <= b ? (md >= a && md <= b) : (md >= a || md <= b)) return `${['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][em]} ${ed}`;
  }
  return null;
}

// Forecast engine: spot tides, per-sample features, species scoring, catch-log patterns.
const Engine = (() => {
  const MIN = 60000, HR = 3600000, DAY = 864e5, STEP = 15 * MIN;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  function spotExtremes(spot, t0, t1) {
    if (spot.station && typeof natTideExtremes === 'function') return natTideExtremes(spot.station.id);
    if (!spot.tide) return [];
    const o = spot.tide;
    return Tide.extremes(TIDE_MODEL, t0 - 8 * HR, t1 + 8 * HR)
      .map(e => e.type === 'H' ? { t: e.t + o.hi * MIN, h: e.h * o.hr, ref: e.h, type: 'H' } : { t: e.t + o.lo * MIN, h: e.h * o.lr, ref: e.h, type: 'L' })
      .sort((a, b) => a.t - b.t);
  }
  function tideAt(ext, t) {
    for (let i = 0; i < ext.length - 1; i++) {
      const a = ext[i], b = ext[i + 1];
      if (t >= a.t && t < b.t) {
        const dur = b.t - a.t, fr = (t - a.t) / dur;
        const h = a.h + (b.h - a.h) * (1 - Math.cos(Math.PI * fr)) / 2;
        const dh = (b.h - a.h) * Math.PI / 2 * Math.sin(Math.PI * fr) / (dur / HR);
        const lowH = Math.min(a.h, b.h), highH = Math.max(a.h, b.h);
        return { h, dh, flood: b.type === 'H', fr, prev: a, next: b, hRel: highH > lowH ? (h - lowH) / (highH - lowH) : .5 };
      }
    }
    return null;
  }
  function stageLabel(ts) {
    if (!ts) return '—';
    if (ts.fr < 0.08) return ts.flood ? 'Slack low, turning in' : 'Slack high, turning out';
    if (ts.fr > 0.92) return ts.flood ? 'Top of the flood' : 'Bottom of the ebb';
    const part = ts.fr < 0.34 ? 'Early' : ts.fr < 0.67 ? 'Mid' : 'Late';
    return part + (ts.flood ? ' incoming' : ' outgoing');
  }
  function stageBin(ts) { if (!ts) return null; return (ts.flood ? 'In-' : 'Out-') + (ts.fr < 0.34 ? 'early' : ts.fr < 0.67 ? 'mid' : 'late'); }

  function lightBin(alt, morning) {
    if (alt < -6) return 'Night';
    if (alt < 10) return morning ? 'Dawn' : 'Dusk';
    if (alt < 35) return morning ? 'Morning' : 'Afternoon';
    return 'Midday';
  }

  // Build features for one local day at a spot
  function buildDay(t0, spot, loc) {
    const days = [-1, 0, 1].map(k => Astro.day(t0 + k * DAY, loc.lat, loc.lng));
    const ast = days[1];
    const majors = days.flatMap(d => d.transits.map(x => x.t));
    const minors = days.flatMap(d => [d.moonrise, d.moonset].filter(Boolean));
    const ext = spotExtremes(spot, t0, t0 + DAY);
    let maxRate = 0.01;
    const samples = [];
    for (let t = t0; t < t0 + DAY; t += STEP) {
      const ts = ext.length ? tideAt(ext, t) : null;
      if (ts) maxRate = Math.max(maxRate, Math.abs(ts.dh));
      const alt = Astro.sunAlt(t, loc.lat, loc.lng);
      const noon = ast.sunrise && ast.sunset ? (ast.sunrise + ast.sunset) / 2 : t0 + 12 * HR;
      const dMaj = Math.min(...majors.map(m => Math.abs(t - m))) / MIN;
      const dMin = minors.length ? Math.min(...minors.map(m => Math.abs(t - m))) / MIN : 999;
      samples.push({ t, ts, alt, morning: t < noon, dMaj, dMin });
    }
    const phaseBoost = 0.82 + 0.18 * Math.abs(Math.cos(2 * Math.PI * ast.phase));
    for (const s of samples) {
      const sMaj = Math.max(0, 1 - Math.max(0, s.dMaj - 45) / 90);
      const sMin = 0.72 * Math.max(0, 1 - Math.max(0, s.dMin - 30) / 60);
      s.sol = Math.max(0.25, sMaj, sMin) * phaseBoost;
      s.solTag = s.dMaj <= 60 ? 'Major solunar' : s.dMin <= 45 ? 'Minor solunar' : '';
      s.cs = s.ts ? Math.abs(s.ts.dh) / maxRate : 0;
      s.lbin = lightBin(s.alt, s.morning);
    }
    // full-moon proximity in days
    const ph = ast.phase, dFull = Math.abs(ph - 0.5) * 29.53, dNew = Math.min(ph, 1 - ph) * 29.53;
    return { t0, spot, ast, ext: ext.filter(e => e.t >= t0 && e.t < t0 + DAY), extAll: ext, samples, majors, minors, dFull, dNew };
  }

  function lightScore(sp, s) {
    const [dawn, day, dusk, night] = sp.light, a = s.alt, edge = s.morning ? dawn : dusk;
    if (a < -12) return night;
    if (a < -6) return night + (edge - night) * (a + 12) / 6;
    if (a < 10) return edge;
    if (a < 25) return edge + (day - edge) * (a - 10) / 15;
    return day;
  }

  function weatherFactor(sp, c, fly) {
    let w = 1;
    const p = { ff: .15, f: .08, s: 0, r: -.04, pf: -.2 }[c.pressure || 's'] || 0;
    w += p * sp.ps;
    const tol = sp.wt * (fly ? 0.65 : 1), wind = +c.wind || 0;
    if (wind > tol) w -= Math.min(0.5, (wind - tol) * 0.03);
    if (c.clarity === 'clear') w += 0.05 * sp.sight * (fly ? 2 : 1);
    if (c.clarity === 'muddy') w -= 0.25 * sp.sight + (fly ? 0.1 : 0);
    if (c.sky === 'overcast') w += 0.05 * (1 - sp.sight) - 0.1 * sp.sight * (fly ? 1 : .5);
    if (c.sky === 'sun') w += 0.05 * sp.sight;
    if (c.sky === 'rain') w -= 0.03;
    if (c.flowF) w *= c.flowF; // river rising/falling (website)
    if (c.windF) w *= c.windF; // wind onto or off the shore (website)
    return clamp(w, 0.4, 1.25);
  }
  function tempFactor(sp, wt) {
    const [mn, lo, hi, mx] = sp.temp;
    if (wt == null || isNaN(wt)) return 1;
    if (wt <= mn || wt >= mx) return 0.12;
    if (wt < lo) return 0.12 + 0.88 * (wt - mn) / (lo - mn);
    if (wt > hi) return 0.12 + 0.88 * (mx - wt) / (mx - hi);
    return 1;
  }

  // personal multipliers from catch log
  function patterns(catches, spId) {
    const list = catches.filter(c => c.species === spId && c.cond);
    if (list.length < 5) return null;
    const cnt = (key, bins) => { const m = {}; bins.forEach(b => m[b] = 1); list.forEach(c => { const v = c.cond[key]; if (v in m) m[v] += 1; }); const tot = Object.values(m).reduce((a, b) => a + b, 0); for (const k in m) m[k] = m[k] / tot * bins.length; return m; };
    return { n: list.length, tide: cnt('stageBin', ['In-early', 'In-mid', 'In-late', 'Out-early', 'Out-mid', 'Out-late']), light: cnt('lbin', ['Dawn', 'Morning', 'Midday', 'Afternoon', 'Dusk', 'Night']) };
  }

  function scoreSpecies(day, sp, cond, opts) {
    const month = new Date(day.t0 + 12 * HR).getMonth();
    const salt = !['fresh', 'greatlakes'].includes(day.spot.water);
    const wt = cond.wtemp !== '' && cond.wtemp != null ? +cond.wtemp : WATER_TEMP[salt ? 'salt' : 'fresh'][month];
    const season = opts.region && typeof seasonFactor === 'function' ? seasonFactor(sp, opts.region, month) : sp.season[month] / 10;
    const tf = tempFactor(sp, wt), wf = weatherFactor(sp, cond, opts.fly);
    const ff = opts.fly ? 0.3 + 0.7 * sp.fly.r / 3 : 1;
    let bed = 1;
    if (sp.moonBed && month >= 3 && month <= 7 && day.dFull <= 4) bed = 1.2;
    const pat = opts.usePatterns ? patterns(opts.catches || [], sp.id) : null;
    const useTide = sp.tide && day.ext.length;
    const out = []; let tailFlag = null;
    for (const s of day.samples) {
      const ls = lightScore(sp, s);
      let tsc = 0.6;
      if (useTide && s.ts) {
        const T = sp.tide;
        tsc = T.m * s.cs + (1 - T.m) * 0.55;
        tsc *= 1 + 0.3 * T.fb * (s.ts.flood ? 1 : -1);
        tsc *= 1 + 0.25 * T.hw * (2 * s.ts.hRel - 1);
        // tailing redfish on big flood tides into the spartina (Apr–Nov)
        if (sp.tailing && s.ts.flood && s.ts.hRel > 0.65 && month >= 3 && month <= 10) {
          const refHigh = s.ts.next.ref;
          if (refHigh >= 5.3) { tsc = Math.max(tsc, opts.fly ? 1.1 : 0.95); tailFlag = tailFlag || { t: s.ts.next.t, h: s.ts.next.h }; }
        }
        tsc = clamp(tsc, 0.05, 1.1);
      }
      let raw = useTide ? 0.12 + 0.36 * tsc + 0.24 * s.sol + 0.28 * ls : 0.12 + 0.4 * s.sol + 0.48 * ls;
      let pf = 1;
      if (pat) {
        const tb = s.ts ? stageBin(s.ts) : null;
        const a = tb && pat.tide[tb] ? Math.pow(pat.tide[tb], 0.35) : 1, b = pat.light[s.lbin] ? Math.pow(pat.light[s.lbin], 0.35) : 1;
        pf = clamp(a * b, 0.8, 1.25);
      }
      const v = clamp(100 * season * tf * wf * ff * bed * raw * pf, 0, 100);
      out.push({ t: s.t, v, tsc, ls, sol: s.sol });
    }
    // best 2-hour window
    let best = 0, bestI = 0; const W = 8;
    for (let i = 0; i + W <= out.length; i++) { let m = 0; for (let j = i; j < i + W; j++) m += out[j].v; m /= W; if (m > best) { best = m; bestI = i; } }
    return { sp, series: out, day: best, bestStart: out[bestI].t, bestEnd: out[bestI].t + W * STEP, season, tf, wf, wt, tail: tailFlag, pat, bed: bed > 1 };
  }

  function windows(res, day, n = 3) {
    const s = res.series, max = Math.max(...s.map(x => x.v)); if (max <= 0) return [];
    const thr = max * 0.82, wins = [];
    let i = 0;
    while (i < s.length) {
      if (s[i].v >= thr) { let j = i, pk = i; while (j < s.length && s[j].v >= thr) { if (s[j].v > s[pk].v) pk = j; j++; } wins.push({ a: s[i].t, b: s[j - 1].t + STEP, peak: s[pk].v, pk: s[pk].t, idx: pk }); i = j; } else i++;
    }
    wins.sort((a, b) => b.peak - a.peak);
    return wins.slice(0, n).map(w => {
      const smp = day.samples[w.idx], why = [];
      if (smp.ts && res.sp.tide) why.push(stageLabel(smp.ts).toLowerCase() + ' tide');
      if (smp.solTag) why.push(smp.solTag.toLowerCase());
      if (smp.lbin === 'Dawn' || smp.lbin === 'Dusk') why.push(smp.lbin === 'Dawn' ? 'first light' : 'last light');
      if (smp.lbin === 'Night' && res.sp.light[3] > .6) why.push('night bite');
      if (smp.lbin === 'Midday' && res.sp.sight > .7) why.push('high sun for spotting');
      return { ...w, why };
    }).sort((a, b) => a.a - b.a);
  }

  function rating(v) { return v >= 70 ? ['Great', 4] : v >= 50 ? ['Good', 3] : v >= 30 ? ['Fair', 2] : v >= 12 ? ['Slow', 1] : ['Poor', 0]; }

  return { buildDay, scoreSpecies, windows, tideAt, stageLabel, stageBin, rating, patterns, spotExtremes, DAY, HR, STEP };
})();

// ===== Standalone website extras (floridafishing.com): live NWS marine forecast, GPS =====
const NWS = (() => {
  const DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

    const { res } = scoreAll(t0); const r = chosen(res); const v = r ? r.day : 0; const [, n] = Engine.rating(v);
    const col = ['#5c6e7c', '#8aa0b2', 'var(--accent2)', '#7fd88e', 'var(--accent)'][n];
    strip += `<button class="day ${t0 === state.day0 ? 'on' : ''}" data-day="${t0}"><b>${i === 0 ? 'Today' : new Date(t0).toLocaleDateString([], { weekday: 'short' })}</b><span>${new Date(t0).getDate()}</span><i style="background:${col}"></i></button>`;
  }
  return `<div class="row">${spotSel}${WEB ? '<button class="btn sm ghost" data-locate="1" style="flex:0 0 auto">📍</button><button class="btn sm ghost" data-addspot2="1" style="flex:0 0 auto">+ Spot</button>' : ''}</div><div class="row" style="margin-top:8px">${spSel}<input type="date" id="datePick" value="${dkey(state.day0)}" style="flex:0 0 140px"></div><div class="days">${strip}</div>`;
}

function viewForecast() {
  const { day, res } = scoreAll(state.day0);
  const sp = spot(), c = cond(), a = day.ast;
  if (!res.length) return topControls() + `<div class="card">No species profiles for this water type.</div>`;
  const r = chosen(res), [rt] = Engine.rating(r.day);
  const wins = Engine.windows(r, day);
  let html = (WEB ? offlineBanner() + welcomeCard() + howFishCard() + installCard() : '') + topControls();
  if (WEB && featOn('bestbet') && typeof bestBetCard === 'function') html += bestBetCard(r, sp, c, day, wins);
  // alerts
  const alerts = [];
  const tailR = res.find(x => x.sp.id === 'redfish' && x.tail);
  if (tailR) alerts.push(`<b>Flood-tide tailing window.</b> High tide of ${tailR.tail.h.toFixed(1)} ft at ${fmtT(tailR.tail.t)} is big enough to push redfish up into the spartina. Be on the flats about 1½ hrs before high.${state.fly ? ' Weedless crab or shrimp fly.' : ''}`);
  const bedR = res.find(x => x.bed);
  if (bedR) alerts.push(`<b>Bream beds:</b> within a few days of the full moon — check shallow sandy flats for bedding bluegill and shellcracker.`);
  const rs = regStatus(r.sp.id, state.day0 + 43200e3);
  if (!rs.open) alerts.push(`<b>${esc(r.sp.name)} harvest is closed</b> through ${rs.until} — catch and release only.`);
  const sf = safety(sp, state.day0);
  if (sf.f === 0) alerts.push(`<b>Not a boating day for this spot:</b> ${esc(sf.why)} from NWS Jacksonville. See the marine forecast below, or let “Pick a spot” find an inshore option.`);
  if (c.pressure === 'pf') alerts.push(`<b>Post-front:</b> bluebird skies after a front usually slow the bite. Fish slower, deeper, and target the warmest part of the day.`);
  html += alerts.map(x => `<div class="alert">${x}</div>`).join('');
  // hero
  html += `<div class="card"><div class="banner">${Art.scene(r.sp.id, sp.water, { night: false })}<div class="cap">${esc(WATER_LABEL[sp.water] || '')}</div></div><div class="hrow"><div style="flex:1"><div class="muted small">${fmtD(state.day0)} · ${esc(sp.name)}</div><h2 style="margin:2px 0 0">${esc(r.sp.name)}${state.fly ? ' on fly' : ''}</h2></div>${WEB && featOn('alerts') ? '<button class="bell" data-albell="1" title="Set a bite alert" aria-label="Set a bite alert">🔔</button>' : ''}${badge(r.day)}</div>
  <div class="small muted" style="margin-top:4px">${rt} · season ${Math.round(r.season * 10)}/10 · water ~${Math.round(r.wt)}°F${r.pat ? ` · tuned by your ${r.pat.n} logged catches` : ''}</div>
  ${WEB && state.fly && featOn('flybench') ? flyBench(r.sp.id, true) : ''}
  ${WEB && (c.flowTxt || c.windTxt) ? `<div class="small" style="margin-top:6px">${c.flowTxt ? '🌊 ' + esc(c.flowTxt) + '<br>' : ''}${c.windTxt ? '💨 ' + esc(c.windTxt) : ''}</div>` : ''}
  ${wins.map(w => `<div class="win"><b>${fmtT(w.a)} – ${fmtT(w.b)}</b> ${badge(w.peak)}<div class="small muted">${esc(w.why.join(' · ') || 'best overlap of factors')}</div></div>`).join('')}
  ${WEB && featOn('colors') ? colorCard(r, sp, c) : ''}
  <div class="chartwrap" id="chartwrap">${chartSVG(day, r)}</div><div class="readout" id="readout">Tap or drag on the chart for details.</div>
  <div class="legend"><span><i style="background:var(--accent)"></i>Bite score</span>${day.ext.length ? '<span><i style="background:var(--tide);opacity:.5"></i>Tide</span>' : ''}<span><i style="background:var(--accent2);opacity:.35"></i>Major solunar</span><span><i style="background:var(--accent2);opacity:.15"></i>Minor</span><span><i style="background:#000;opacity:.35"></i>Night</span></div></div>`;
  if (WEB && featOn('now')) html += viewNow();
  if (!WEB || featOn('pickspot')) html += viewPickSpot();
  if (WEB && featOn('week')) html += viewWeek();
  // other species
  if (state.spId === 'auto' && (!WEB || featOn('others'))) {
    html += `<div class="card"><h2>Other good bets</h2>${res.slice(1, 6).map(x => `<div class="pick" data-sp="${x.sp.id}">${Art.fish(x.sp.id, { w: 70, cls: 'thumb' })}<div class="nm"><b>${esc(x.sp.name)}</b><span class="small muted">best ${fmtT(x.bestStart)} – ${fmtT(x.bestEnd)}</span></div>${badge(x.day)}</div>`).join('')}<div class="note">Tap a species to forecast it.</div></div>`;
  }
  // tides
  if (day.ext.length && (!WEB || featOn('tides'))) {
    html += `<div class="card"><h2>Tides <span class="small muted">· ${esc(sp.src || '')}</span></h2><div class="tides">${day.ext.map(e => `<div class="tide">${e.type === 'H' ? '▲ High' : '▼ Low'} <b>${fmtT(e.t)}</b> · ${e.h.toFixed(1)} ft</div>`).join('')}</div><div class="note">${WEB && sp.station ? `NOAA tide predictions for <a href="https://tidesandcurrents.noaa.gov/noaatidepredictions.html?id=${esc(sp.station.id)}" target="_blank" rel="noopener">${esc(sp.station.name)} (${esc(sp.station.id)})</a>, heights in feet above MLLW. Wind and river flow can shift real water levels.` : 'Predicted from NOAA Mayport (8720218) tide harmonics; times are usually within ~15 min, heights within ~0.5 ft. Wind and river flow can shift real water levels.'}</div></div>`;
  }
  // sun & moon
  const maj = day.majors.filter(t => t >= state.day0 && t < state.day0 + 864e5).sort((x, y) => x - y);
  const mins = day.minors.filter(t => t >= state.day0 && t < state.day0 + 864e5).sort((x, y) => x - y);
  if (!WEB || featOn('solunar'))
  html += `<div class="card"><h2>Sun, moon & solunar</h2><div class="grid2">
   <div class="kv"><b>${fmtT(a.sunrise)}</b><span>Sunrise (first light ${fmtT(a.dawn)})</span></div><div class="kv"><b>${fmtT(a.sunset)}</b><span>Sunset (last light ${fmtT(a.dusk)})</span></div>
   <div class="kv"><b>${esc(a.phaseName)}</b><span>${Math.round(a.illum * 100)}% illuminated</span></div><div class="kv"><b>${fmtT(a.moonrise)} / ${fmtT(a.moonset)}</b><span>Moonrise / moonset</span></div></div>
   <div style="margin-top:8px">${maj.map(t => `<span class="tag hot">Major ${fmtT(t - 3600e3)}–${fmtT(t + 3600e3)}</span>`).join('')}${mins.map(t => `<span class="tag">Minor ${fmtT(t - 2700e3)}–${fmtT(t + 2700e3)}</span>`).join('')}</div>
   <div class="note">Majors are when the moon is overhead or underfoot; minors are moonrise and moonset. ${Math.min(day.dFull, day.dNew) < 3 ? 'Near a new or full moon these periods tend to be stronger.' : ''}</div></div>`;
  if (!WEB || featOn('marine')) html += viewMarine();
  if (!WEB || featOn('rules')) html += regsCard(r.sp, sp);

  return html;
}

   ${body}

function viewPickSpot() {
  const c0 = state.day0, opts = { fly: state.fly, usePatterns: state.settings.usePatterns, catches: state.catches };
  const rows = spots().map(sp => {
    const day = getDay(c0, sp), c = cond(c0);
    const pool = WEB && sp.lat != null ? SPECIES.filter(s => speciesFits(s, sp)) : SPECIES.filter(s => s.waters.includes(sp.water));
    const res = pool.map(s => Engine.scoreSpecies(day, s, c, { ...opts, region: spotRegion(sp) }));
    const target = state.spId !== 'auto' ? res.find(r => r.sp.id === state.spId) : null;
    const best = target || res.sort((a, b) => b.day - a.day)[0];
    if (!best) return null;
    const sf = safety(sp, c0);
    return { sp, best, sf, v: best.day * sf.f };
  }).filter(Boolean).filter(x => state.spId === 'auto' || x.best.sp.id === state.spId).sort((a, b) => b.v - a.v).slice(0, 4);
  if (!rows.length) return '';

   ${rows.map((x, i) => `<div class="pick" data-gospot="${esc(x.sp.id)}">${Art.fish(x.best.sp.id, { w: 70, cls: 'thumb' })}<div class="nm"><b>${i === 0 ? '★ ' : ''}${esc(x.sp.name)}</b><span class="small muted">${esc(x.best.sp.name)} · ${fmtT(x.best.bestStart)} – ${fmtT(x.best.bestEnd)}${x.sf.why ? ' · ' + esc(x.sf.why) : ''}</span></div>${badge(x.v)}</div>`).join('')}
   ${blocked.length ? `<div class="note">Left out for boating safety: ${blocked.map(b => esc(b.sp.name)).join(', ')} (${esc(blocked[0].sf.why)}).</div>` : ''}
   <div class="note">Ranks every spot by its best bite window, then discounts spots the marine forecast makes unsafe or rough. Tap a spot to switch to it.</div></div>`;
}

   <a href="https://myfwc.com/fishing/freshwater/regulations/" target="_blank" rel="noopener">FWC freshwater regs</a></div>`}</div>`;

function chartSVG(day, r) {
  const W = 360, H = 170, L = 26, R = 8, T = 8, B = 22, cw = W - L - R, ch = H - T - B;
  const x = t => L + (t - day.t0) / 864e5 * cw;
  const ys = v => T + ch - v / 100 * ch;
  let g = '';
  // night shading
  const a = day.ast;
  if (a.dawn) g += `<rect x="${L}" y="${T}" width="${x(a.dawn) - L}" height="${ch}" fill="#000" opacity=".3"/>`;
  if (a.dusk) g += `<rect x="${x(a.dusk)}" y="${T}" width="${L + cw - x(a.dusk)}" height="${ch}" fill="#000" opacity=".3"/>`;
  // solunar
  day.majors.forEach(t => { const a1 = Math.max(day.t0, t - 3600e3), b1 = Math.min(day.t0 + 864e5, t + 3600e3); if (b1 > a1) g += `<rect x="${x(a1)}" y="${T}" width="${x(b1) - x(a1)}" height="${ch}" fill="var(--accent2)" opacity=".22"/>`; });
  day.minors.forEach(t => { const a1 = Math.max(day.t0, t - 2700e3), b1 = Math.min(day.t0 + 864e5, t + 2700e3); if (b1 > a1) g += `<rect x="${x(a1)}" y="${T}" width="${x(b1) - x(a1)}" height="${ch}" fill="var(--accent2)" opacity=".1"/>`; });
  // tide
  if (day.ext.length) {
    const pts = []; let mn = Infinity, mx = -Infinity;
    for (let t = day.t0; t <= day.t0 + 864e5; t += 10 * 60000) { const ts = Engine.tideAt(day.extAll, t); if (ts) { pts.push([t, ts.h]); mn = Math.min(mn, ts.h); mx = Math.max(mx, ts.h); } }
    mn = Math.min(mn, 0) - .3; mx = mx + .3;
    const yt = h => T + ch - (h - mn) / (mx - mn) * ch;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + yt(p[1]).toFixed(1)).join('');
    g += `<path d="${d} L${x(pts[pts.length - 1][0])} ${T + ch} L${x(pts[0][0])} ${T + ch}Z" fill="var(--tide)" opacity=".22"/><path d="${d}" fill="none" stroke="var(--tide)" stroke-width="1.5" opacity=".8"/>`;
    for (let f = Math.ceil(mn); f <= mx; f += 2) g += `<text x="${W - 2}" y="${yt(f) + 3}" font-size="8.5" fill="var(--tide)" text-anchor="end">${f}ft</text>`;
  }
  // score
  const sd = r.series.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + ys(p.v).toFixed(1)).join('');
  g += `<path d="${sd}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
  // axes
  for (let v = 0; v <= 100; v += 50) g += `<line x1="${L}" x2="${L + cw}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${L - 4}" y="${ys(v) + 3}" font-size="9" fill="var(--muted)" text-anchor="end">${v}</text>`;
  for (let h = 0; h <= 24; h += 3) { const t = day.t0 + h * 3600e3; g += `<text x="${x(t)}" y="${H - 6}" font-size="9" fill="var(--muted)" text-anchor="middle">${h === 0 || h === 24 ? '12a' : h === 12 ? '12p' : h > 12 ? (h - 12) + 'p' : h + 'a'}</text>`; }
  const now = Date.now();
  if (now >= day.t0 && now < day.t0 + 864e5) g += `<line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${T + ch}" stroke="var(--text)" stroke-width="1" opacity=".6"/>`;
  g += `<line id="cursor" x1="0" x2="0" y1="${T}" y2="${T + ch}" stroke="var(--text)" stroke-width="1" opacity="0"/>`;
  return `<svg id="chart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
}
function bindChart() {
  const svg = $('#chart'); if (!svg) return;
  const handler = ev => {
    const rect = svg.getBoundingClientRect(), px = (ev.clientX - rect.left) / rect.width * 360;
    const fr = Math.max(0, Math.min(1, (px - 26) / (360 - 34)));
    const { day, res } = scoreAll(state.day0), r = chosen(res);

// ---------- How did the forecast do? ----------
function catchSpot(c) {

}

function runForecastCheck() {

  const key = list.map(c => c.id + c.ts).join('|');
  if (CHECK.key === key) return CHECK.res;
  if (list.length < 5) return { n: list.length };
  const rows = [];
  for (const c of list) {
    const sp = catchSpot(c), t0 = midnight(c.ts), s = SPMAP[c.species];
    const k = c.cond || {};

    const opts = { fly: c.method === 'fly', region: spotRegion(sp) }; // no learned patterns here, so the check is fair
    const day = getDay(t0, sp), r = Engine.scoreSpecies(day, s, cnd, opts);
    const i = Math.min(r.series.length - 1, Math.max(0, Math.round((c.ts - t0) / Engine.STEP)));
    const v = r.series[i].v, vals = r.series.map(x => x.v);

    const others = [-6, -3, 3, 6].map(d => Engine.scoreSpecies(getDay(midnight(t0 + d * 864e5 + 3600e3), sp), s, cnd, opts).day);
    const dayPct = others.filter(x => x < r.day).length / others.length;
    rows.push({ c, s, v, hourPct, day: r.day, dayPct, stage: k.stageBin, light: k.lbin });
  }

  const res = { n, hourTop: share(r => r.hourPct >= 2 / 3), dayGood: share(r => r.dayPct >= .5), avgV: rows.reduce((a, r) => a + r.v, 0) / n, rows, bySp: {} };

    const top = l.filter(x => x.hourPct >= 2 / 3).length / l.length;

  }).join('');
  return `<div class="card"><div class="hrow"><h2 style="flex:1;margin:0">How’s the forecast doing?</h2><button class="btn sm ghost" data-runcheck="0">Hide</button></div>

      if (!best || c.acc < best.acc) { best = c; onProgress && onProgress(c); }
      if (c.acc <= wantM) finish();

}

// ---------- Water clarity: your setting wins; otherwise estimate it from rain, river flow, wind and water type ----------
function estClarity(sp, a, flow) {
  if (!sp) return null;

  }
  if (flow && flow.ratio >= 1.6) { lvl += 1; why.push('river running high'); }
  if (a && a.wind != null && ['surf', 'inshore', 'greatlakes'].includes(sp.water) && a.wind >= 16) { lvl += 1; why.push(`${a.wind} mph wind stirring it up`); }
  if (sp.water === 'fresh' && typeof fwKindOf === 'function') { const k = fwKindOf(sp); if (k === 'river' && !why.length) why.push('rivers usually carry some color'); if ((k === 'lake' || k === 'reservoir') && !why.length) why.push('typical lake color'); }

  return { v: order[Math.max(0, Math.min(2, lvl))], why: 'estimated: ' + why.join(', ') };
}

// ---------- Wind direction: is it blowing onto the shore you fish? ----------
var FACING = { N: 0, NE: 45, E: 90, SE: 135, S: 180, SW: 225, W: 270, NW: 315 };

// returns { factor, text } — onshore wind stacks bait (and fish) against the shore; strong offshore wind flattens and clears it
function windEffect(sp, c) {
  if (c.windDir == null || c.wind == null) return null;
  const f = spotFacing(sp), from = compass(c.windDir);
  if (f == null) return { factor: 1, text: `Wind from the ${from} at ${Math.round(c.wind)} mph` };
  const diff = Math.abs(((c.windDir - f) % 360 + 540) % 360 - 180); // 0 = blowing straight onto this shore
  if (diff <= 50 && c.wind >= 6 && c.wind <= 20) return { factor: 1.07, text: `Wind from the ${from} at ${Math.round(c.wind)} mph is blowing onto your shore — bait and fish stack up on that bank` };
  if (diff <= 50 && c.wind > 20) return { factor: .95, text: `Strong onshore wind (${from} ${Math.round(c.wind)} mph) — rough, muddy water on this shore` };
  if (diff >= 130 && c.wind >= 12) return { factor: .97, text: `Offshore wind (${from} ${Math.round(c.wind)} mph) — calmer, clearer water but bait pushed away from this bank` };
  return { factor: 1, text: `Wind from the ${from} at ${Math.round(c.wind)} mph — crosswind on this spot` };
}

// ---------- River flow: compare today with the past week ----------
function flowInfo(sp) {

  const n = natNow(sp), u = n && n.usgs; if (!u || !u.flowCfs || !u.flowWeek || u.km > 25) return null;
  const now = u.flowCfs.v, med = u.flowWeek.median, d1 = u.flowWeek.change24; if (!med) return null;

  let factor = 1, text;

  else if (ratio >= 1.4 && rising) { factor = .85; text = 'River is rising — fishing usually slows as it muddies'; }
  else if (ratio >= 1.3 && falling) { factor = 1.08; text = 'River is falling and clearing after a rise — often a good bite'; }
  else if (ratio <= .55) { factor = .93; text = 'River is low — fish concentrate in deeper holes; go light and stealthy'; }
  else text = `River flow is near normal for the week${rising ? ' (rising slightly)' : falling ? ' (falling slightly)' : ''}`;
  return { ratio, factor, text: `${text}. ${Math.round(now).toLocaleString()} cfs vs ${Math.round(med).toLocaleString()} cfs typical this week (${u.name}).` };
}

// ---------- Error reports: the first few errors in a visit go to an insert-only table so problems get fixed ----------
var ERR_SENT = new Set();
function reportError(msg, stack) {
  try {
    msg = String(msg || 'error').slice(0, 500); const key = msg.slice(0, 120);
    if (ERR_SENT.has(key) || ERR_SENT.size >= 5 || /ResizeObserver|Script error\.?$|extension:\/\//i.test(msg + (stack || ''))) return;
    ERR_SENT.add(key);
    const body = { msg, stack: String(stack || '').slice(0, 2000), url: (location.pathname + location.hash).slice(0, 300), ua: navigator.userAgent.slice(0, 300), build: (document.querySelector('meta[name="build"]') || {}).content || '' };
    if (Cloud.user && Cloud.sb) Cloud.sb.from('forecast_errors').insert(body).then(() => { }, () => { });
    else fetch(SB_URL + '/rest/v1/forecast_errors', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(body), keepalive: true }).catch(() => { });
  } catch (e) { }
}
window.addEventListener('error', e => reportError(e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => { const r = e.reason || {}; if (/Failed to fetch|NetworkError|Load failed|aborted|timeout/i.test(r.message || String(r))) return; reportError('promise: ' + (r.message || String(r)), r.stack); });

// ---------- Trip report: one day at one spot — the forecast, the conditions and what you caught ----------
function tripCatches(t0, spotId) { return state.catches.filter(c => c.ts >= t0 && c.ts < t0 + 864e5 && (!spotId || c.spot === spotId)); }
function tripReport(t0, spotId) {
  const sp = spots().find(s => s.id === spotId) || spot(), cs = tripCatches(t0, sp.id), all = tripCatches(t0);
  const list = cs.length ? cs : all; const prev = state.spotId; state.spotId = sp.id;
  let best = null, c = {};
  try { const r = scoreAll(t0); best = chosen(r.res); c = cond(t0); } catch (e) { }
  state.spotId = prev;
  const fish = list.reduce((a, x) => a + (+x.count || 1), 0), sp2 = {};
  list.forEach(x => sp2[x.species] = (sp2[x.species] || 0) + (+x.count || 1));
  const big = list.filter(x => +x.length).sort((a, b) => b.length - a.length)[0];
  const lines = [
    `🎣 Trip report — ${fmtD(t0)} · ${sp.name}`,
    best ? `Forecast: ${best.sp.name} ${Math.round(best.day)}/100 (${Engine.rating(best.day)[0]}), best ${fmtT(best.bestStart)}–${fmtT(best.bestEnd)}` : '',
    [c.pressure && { ff: 'barometer falling fast', f: 'barometer falling', s: 'steady barometer', r: 'barometer rising', pf: 'post-front' }[c.pressure], c.wind != null && `wind ${Math.round(c.wind)} mph${c.windDir != null ? ' ' + compass(c.windDir) : ''}`, c.sky, c.clarity && c.clarity + ' water', c.wtemp && `water ${Math.round(c.wtemp)}°F`].filter(Boolean).join(' · '),
    fish ? `Caught: ${fish} fish — ${Object.entries(sp2).map(([k, n]) => `${n} ${SPMAP[k] ? SPMAP[k].name : k}`).join(', ')}` : 'No fish logged this day.',
    big ? `Biggest: ${big.length}" ${SPMAP[big.species] ? SPMAP[big.species].name : big.species}${big.bait ? ' on ' + big.bait : ''} at ${fmtT(big.ts)}` : '',
    ...list.slice(0, 12).map(x => `• ${fmtT(x.ts)} ${SPMAP[x.species] ? SPMAP[x.species].name : x.species}${x.count > 1 ? ' ×' + x.count : ''}${x.length ? ' ' + x.length + '"' : ''}${x.bait ? ' — ' + x.bait : ''}${x.cond && x.cond.stage ? ' (' + x.cond.stage + ')' : ''}`),

}

  const saved = lsGet('ff.ramps.' + k, null); if (saved && saved.t > Date.now() - 30 * 864e5) return RAMPS.cells[k] = saved.list;
  const [a, b] = k.split(',').map(Number), bb = `${a * .5},${b * .5},${a * .5 + .5},${b * .5 + .5}`;
  const q = `[out:json][timeout:25];(nwr["leisure"="slipway"](${bb});nwr["amenity"="boat_ramp"](${bb}););out center tags 300;`;

  }

// ===== Check the water: a photo gives the light level (from its exposure data) and Claude reads clarity & tint =====

// Read exposure time, f-number and ISO from a JPEG's EXIF block (no library needed).
async function readExposure(file) {
  try {
    const buf = await file.slice(0, 256 * 1024).arrayBuffer(), v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let p = 2;
    while (p + 4 < v.byteLength) {
      const m = v.getUint16(p), len = v.getUint16(p + 2);
      if (m === 0xFFE1 && v.getUint32(p + 4) === 0x45786966) return parseTiff(v, p + 10);
      if ((m & 0xFF00) !== 0xFF00) break;
      p += 2 + len;
    }
  } catch (e) { }
  return null;
}
function parseTiff(v, t) {
  const le = v.getUint16(t) === 0x4949, u16 = o => v.getUint16(t + o, le), u32 = o => v.getUint32(t + o, le);
  const out = {};
  const rat = o => { const a = u32(o), b = u32(o + 4); return b ? a / b : null; };
  const str = (o, n) => { let s = ''; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(v.getUint8(t + o + i)); return s; };
  const ifd = (off, cb) => { const n = u16(off); for (let i = 0; i < n; i++) { const e = off + 2 + i * 12; cb(u16(e), u16(e + 2), u32(e + 4), e + 8); } };
  let exifOff = null;
  ifd(u32(4), (tag, type, cnt, vo) => { if (tag === 0x8769) exifOff = u32(vo - 0); });
  if (exifOff == null) return null;
  ifd(exifOff, (tag, type, cnt, vo) => {
    if (tag === 0x829A) out.t = rat(u32(vo));          // ExposureTime (s)
    else if (tag === 0x829D) out.f = rat(u32(vo));     // FNumber
    else if (tag === 0x8827) out.iso = u16(vo);        // ISO
    else if (tag === 0x9003 && cnt >= 19) out.taken = str(u32(vo), cnt); // DateTimeOriginal "YYYY:MM:DD HH:MM:SS"
  });
  if (!out.t || !out.f || !out.iso) return null;
  out.ev = Math.log2(out.f * out.f / out.t) - Math.log2(out.iso / 100); // exposure value at ISO 100
  if (out.taken) { const [d, h] = out.taken.split(' '), [Y, M, D] = d.split(':').map(Number), [hh, mm, ss] = h.split(':').map(Number); out.takenMs = new Date(Y, M - 1, D, hh, mm, ss).getTime(); }
  return out;
}
// EV100 → what an angler would call it
function lightFromEV(ev) {
  if (ev < 4) return { band: 'night', label: 'dark — night or deep twilight' };
  if (ev < 8) return { band: 'low', label: 'very low light — dawn, dusk or a storm' };
  if (ev < 11.5) return { band: 'low', label: 'low light — heavy overcast or shade' };
  if (ev < 13.5) return { band: 'bright', label: 'moderate — bright overcast or hazy sun' };
  return { band: 'bright', label: 'bright sun' };
}

  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  const mobile = ios || /Android/.test(navigator.userAgent);
  // wait until it's earned a spot: a second visit, a saved spot, or an alert turned on
  if (visitDays() < 2 && !(state.settings.mySpots || []).length) return '';
  if (!mobile && !INSTALL.evt) return '';
  return `<div class="card installcard"><div class="hrow"><div style="flex:1"><b>📲 Put it on your home screen</b><div class="small muted">Opens like an app, works with no signal${ios ? ', and lets bite alerts reach your iPhone' : ''}.</div></div>
   <button class="btn sm" data-install="1">${INSTALL.evt ? 'Install' : 'Show me'}</button><button class="btn sm ghost" data-installlater="1">Later</button></div></div>`;
}
function installSheet() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  const steps = ios ? [['Tap the Share button', 'The square with an arrow ⬆️ — at the bottom of Safari (or top right on iPad). In Chrome it\'s at the top right.'], ['Choose “Add to Home Screen”', 'Scroll down the list if you don\'t see it.'], ['Tap “Add”', 'Fish Bite Forecast appears on your home screen. Open it from there from now on — alerts and offline work best that way.']]
    : [['Open the browser menu', 'The ⋮ at the top right in Chrome.'], ['Tap “Install app” or “Add to Home screen”', ''], ['Tap “Install”', 'Open it from your home screen from now on.']];
  $('#sheet').innerHTML = `<div class="in"><div class="hrow"><h2 style="flex:1;margin:0">Add to your home screen</h2><button class="btn sm ghost" data-close="1">Close</button></div>
   ${steps.map(([t, d], i) => `<div class="instep"><span>${i + 1}</span><div><b>${t}</b>${d ? `<div class="small muted">${d}</div>` : ''}</div></div>`).join('')}</div>`;

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-install],[data-installlater]'); if (!t) return;
  if (t.dataset.installlater) { state.settings.installNudge = Date.now() + 21 * 864e5; Store.saveSettings(); render(); return; }
  if (window.Stats) Stats.track('install_prompt');
  if (INSTALL.evt) { INSTALL.evt.prompt(); const r = await INSTALL.evt.userChoice.catch(() => null); INSTALL.evt = null; if (r && r.outcome === 'accepted') { state.settings.installNudge = Date.now() + 3650 * 864e5; Store.saveSettings(); } render(); }
  else installSheet();
});

document.addEventListener('click', e => {
  const c = e.target.closest('[data-hf]'); if (c) { c.classList.toggle('on'); return; }
  if (!e.target.closest('[data-hfdone]')) return;
  const on = new Set([...document.querySelectorAll('[data-hf].on')].map(x => x.dataset.hf));
  const salt = on.has('w:salt') || on.has('w:off'), fresh = on.has('w:lake') || on.has('w:river'), boat = on.has('f:boat') || on.has('w:off'), fly = on.has('g:fly'), conv = on.has('g:conv');
  const f = {};
  if (on.size) {
    if (!boat) f.marine = false;                 // seas and small craft advisories are for boaters
    if (!salt) { f.tides = false; f.marine = false; } // freshwater only
    if (!fly) f.flybench = false;
    if (!on.has('w:river') && !salt) f.now = false;   // live gauges matter for rivers and the coast
  }
  state.settings.features = f; state.settings.featPrompted = true; state.settings.howFish = [...on];
  if (fly && !conv) { state.fly = true; state.settings.fly = true; }
  Store.saveSettings(); toast('Set up — change anything in Settings → Your features'); render();
  if (window.Stats) { Stats.track('howfish_set'); on.forEach(x => Stats.track('hf_' + x.replace(':', '_'))); }
});

/* First-time tips: a short step-by-step walkthrough that dims the screen, highlights one thing at a time and points at it.
   Tour.run(id, steps, {force})  steps: [{ el: "css selector" | Element | null, title, text, place: "auto"|"above"|"below" }]
     • Runs once per id (remembered on this device) unless force is true. Steps whose element isn't on screen are skipped;
       a step with no el shows as a centered card.
   Tour.reset()   forget which tours were seen, so every tip shows again.
   Tour.seen(id)  true if that tour already ran.
   Shared by fishforecast.net and Fly Bench — keep the two copies identical. */
(function () {
  if (window.Tour) return;
  var KEY = "tour.seen.", active = null;
  function seen(id) { try { return !!localStorage.getItem(KEY + id); } catch (e) { return false; } }
  function mark(id) { try { localStorage.setItem(KEY + id, String(Date.now())); } catch (e) { } }
  function reset() { try { Object.keys(localStorage).filter(function (k) { return k.indexOf(KEY) === 0; }).forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { } }
  function css() {
    if (document.getElementById("tour-css")) return;
    var s = document.createElement("style"); s.id = "tour-css";
    s.textContent = ".tour-hole{position:fixed;z-index:9998;border-radius:12px;box-shadow:0 0 0 9999px rgba(5,12,22,.62),0 0 0 3px #f2b84b;transition:all .25s ease;pointer-events:none}"
      + ".tour-hole.none{box-shadow:0 0 0 9999px rgba(5,12,22,.62);width:0!important;height:0!important}"
      + ".tour-tip{position:fixed;z-index:9999;max-width:min(330px,calc(100vw - 24px));background:#fffdf7;color:#14202e;border-radius:14px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:top .25s ease,left .25s ease}"
      + ".tour-tip h4{margin:0 0 4px;font-size:16px}.tour-tip p{margin:0}.tour-tip .tour-n{font-size:12px;color:#6b7785;margin-bottom:4px}"
      + ".tour-tip .tour-b{display:flex;gap:8px;margin-top:12px;align-items:center}.tour-tip button{font:600 14px system-ui,sans-serif;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}"
      + ".tour-tip .tour-next{background:#14202e;color:#fff;margin-left:auto}.tour-tip .tour-back{background:#e9e4d8;color:#14202e}.tour-tip .tour-skip{background:none;color:#6b7785;padding:8px 4px}"
      + ".tour-tip .tour-arrow{position:absolute;width:16px;height:16px;background:#fffdf7;transform:rotate(45deg)}"
      + ".tour-catch{position:fixed;inset:0;z-index:9997}";
    document.head.appendChild(s);
  }
  function find(el) { if (!el) return null; var e = typeof el === "string" ? document.querySelector(el) : el; if (!e) return null; var r = e.getBoundingClientRect(); return (r.width || r.height) && getComputedStyle(e).visibility !== "hidden" ? e : null; }
  function run(id, steps, opt) {
    opt = opt || {};
    if (active || (!opt.force && seen(id))) return false;
    css();
    var list = steps.filter(function (s) { return !s.el || find(s.el); });
    if (!list.length) return false;
    var i = 0, hole = document.createElement("div"), tip = document.createElement("div"), cat = document.createElement("div");
    hole.className = "tour-hole"; tip.className = "tour-tip"; cat.className = "tour-catch"; tip.setAttribute("role", "dialog");
    document.body.appendChild(cat); document.body.appendChild(hole); document.body.appendChild(tip);
    active = { id: id };
    function end(done) {
      mark(id); active = null; [cat, hole, tip].forEach(function (x) { x.remove(); });
      window.removeEventListener("resize", place); window.removeEventListener("scroll", place, true); document.removeEventListener("keydown", key);
      if (opt.onEnd) try { opt.onEnd(done); } catch (e) { }
    }
    function key(e) { if (e.key === "Escape") end(false); else if (e.key === "ArrowRight" || e.key === "Enter") go(1); else if (e.key === "ArrowLeft") go(-1); }
    function go(d) { i += d; if (i >= list.length) return end(true); if (i < 0) i = 0; show(); }
    function place() {
      var st = list[i], e = find(st.el), vw = innerWidth, vh = innerHeight, pad = 6;
      var old = tip.querySelector(".tour-arrow"); if (old) old.remove();
      if (!e) { hole.className = "tour-hole none"; hole.style.left = vw / 2 + "px"; hole.style.top = vh / 2 + "px"; tip.style.left = Math.max(12, (vw - tip.offsetWidth) / 2) + "px"; tip.style.top = Math.max(12, (vh - tip.offsetHeight) / 2) + "px"; return; }
      var r = e.getBoundingClientRect();
      hole.className = "tour-hole";
      hole.style.left = r.left - pad + "px"; hole.style.top = r.top - pad + "px"; hole.style.width = r.width + pad * 2 + "px"; hole.style.height = r.height + pad * 2 + "px";
      var tw = tip.offsetWidth, th = tip.offsetHeight, below = st.place === "below" || (st.place !== "above" && r.bottom + th + 24 < vh) || r.top < th + 24;
      var top = below ? r.bottom + pad + 14 : r.top - pad - 14 - th;
      top = Math.max(8, Math.min(vh - th - 8, top));
      var left = Math.max(12, Math.min(vw - tw - 12, r.left + r.width / 2 - tw / 2));
      tip.style.top = top + "px"; tip.style.left = left + "px";
      var a = document.createElement("div"); a.className = "tour-arrow";
      var ax = Math.max(14, Math.min(tw - 30, r.left + r.width / 2 - left - 8));
      a.style.left = ax + "px"; if (below) a.style.top = "-7px"; else a.style.bottom = "-7px";
      tip.appendChild(a);
    }
    function show() {
      var st = list[i], e = find(st.el);
      tip.innerHTML = '<div class="tour-n">' + (list.length > 1 ? "Step " + (i + 1) + " of " + list.length : "Tip") + '</div>' + (st.title ? "<h4>" + st.title + "</h4>" : "") + "<p>" + st.text + "</p>"
        + '<div class="tour-b"><button class="tour-skip">' + (i < list.length - 1 ? "Skip tips" : "") + '</button>' + (i ? '<button class="tour-back">Back</button>' : "") + '<button class="tour-next">' + (i < list.length - 1 ? "Next" : "Got it") + "</button></div>";
      tip.querySelector(".tour-next").onclick = function () { go(1); };
      var b = tip.querySelector(".tour-back"); if (b) b.onclick = function () { go(-1); };
      tip.querySelector(".tour-skip").onclick = function () { end(false); };
      if (!tip.querySelector(".tour-skip").textContent) tip.querySelector(".tour-skip").style.display = "none";
      if (e) { var r = e.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight - 90) e.scrollIntoView({ block: "center", behavior: "instant" in document.documentElement.style ? "instant" : "auto" }); }
      requestAnimationFrame(place); setTimeout(place, 60);

    }
    cat.onclick = function () { go(1); };

  }

  window.Tour = { run: run, later: later, reset: reset, seen: seen, active: function () { return !!active; } };
})();

function tourFor(name, opt) { if (!WEB || !window.Tour || !TOURS[name]) return; Tour.later('ff.' + name, TOURS[name](), opt); }
// after each screen draws, show its tips the first time
function toursAfterRender() {
  if (!WEB || !window.Tour || !featOn('tips') || Tour.active() || document.querySelector('#sheet.on')) return;
  if (state.tab === 'forecast') { if (!Tour.seen('ff.forecast')) tourFor('forecast', { delay: 1200 }); }
  else if (state.tab === 'map') tourFor('map', { delay: 900 });
  else if (state.tab === 'log') { tourFor('log'); if (Tour.seen('ff.log') && document.querySelector('.code')) tourFor('crew'); }
  else if (state.tab === 'settings') tourFor('settings');
}
// the conditions card is far down the forecast: show its tips when it scrolls into view
var condObs = null;
function watchConditions() {
  if (!WEB || !window.Tour || Tour.seen('ff.conditions') || !('IntersectionObserver' in window)) return;
  const el = document.getElementById('cPress'); if (!el) return;
  if (condObs) condObs.disconnect();
  condObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && Tour.seen('ff.forecast') && !Tour.active()) { condObs.disconnect(); tourFor('conditions', { delay: 600 }); } }, { threshold: 1 });
  condObs.observe(el);
}
document.addEventListener('click', e => { if (e.target.closest('[data-tipsagain]')) { e.preventDefault(); Tour.reset(); toast('Tips will show again on each screen'); state.tab = 'forecast'; render(); window.scrollTo(0, 0); } });

/* Privacy-friendly usage counting, shared by fishforecast.net and Fly Bench (keep both copies identical).
   • A random device id lives in this browser only. No names, emails, IP addresses or locations are sent.
   • Browsers with "Do Not Track" or Global Privacy Control turned on send nothing.
   • Invite links (?r=shop-name) are remembered on first visit so a shop, club or creator gets credit.
   Stats.init(app, url, key)  — call once; records one "visit" per day.   Stats.track("event_name") — a feature was used. */
(function () {
  if (window.Stats) return;
  var APP = null, URL_ = null, KEY = null, off = false, recent = {};
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function rid() { var a = new Uint8Array(10); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.random() * 256; }); return Array.from(a, function (b) { return (b % 36).toString(36); }).join(""); }
  function device() { var d = ls("stats.device"); if (!d || !/^[a-z0-9]{8,32}$/.test(d)) { d = rid() + rid(); d = d.slice(0, 16); ls("stats.device", d); } return d; }
  function platform() { var u = navigator.userAgent; return /iPhone|iPad|iPod/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1) ? "ios" : /Android/.test(u) ? "android" : /Windows/.test(u) ? "windows" : /Mac OS X/.test(u) ? "mac" : "other"; }
  function installed() { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } }
  function ref() {
    try {
      var p = new URLSearchParams(location.search), r = (p.get("r") || p.get("ref") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 32);
      if (r.length >= 2) {
        if (!ls("stats.ref")) ls("stats.ref", r);
        p.delete("r"); p.delete("ref"); var q = p.toString();
        history.replaceState(history.state, "", location.pathname + (q ? "?" + q : "") + location.hash);
      }
    } catch (e) { }
    var v = ls("stats.ref"); return v && /^[a-z0-9-]{2,32}$/.test(v) ? v : null;
  }
  function send(event) {
    if (off || !APP) return;
    var body = JSON.stringify({ app: APP, device: device(), event: event, ref: ref(), platform: platform(), installed: installed() });
    try { fetch(URL_ + "/rest/v1/app_events", { method: "POST", keepalive: true, headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json", Prefer: "return=minimal" }, body: body }).catch(function () { }); } catch (e) { }
  }
  function track(event) {
    event = String(event || "").toLowerCase().replace(/[^a-z0-9_]/g, "_").slice(0, 32); if (event.length < 2) return;
    var now = Date.now(); if (recent[event] && now - recent[event] < 30000) return; recent[event] = now;
    send(event);
  }
  function init(app, url, key) {
    APP = app; URL_ = url; KEY = key;
    off = navigator.doNotTrack === "1" || window.doNotTrack === "1" || navigator.globalPrivacyControl === true || /[?&]demo\b/.test(location.search) || /^(localhost|127\.)/.test(location.hostname);
    ref();
    var today = new Date().toISOString().slice(0, 10);
    if (ls("stats.visit." + app) !== today) { ls("stats.visit." + app, today); send("visit"); }
  }
  window.Stats = { init: init, track: track, off: function () { return off; } };
})();

{

function accountCard() {

async function draftSpot(lat, lng, name, acc, nearSpot) {

async function draftWaterType(lat, lng) {

  addDraft.fw = { kind: j.kind, name: j.name || null, acres: j.acres || null };

// Explain why location failed and how to fix it, instead of a two-second toast.
function geoHelp(err) {
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua), android = /Android/.test(ua);
  let why, how;
  if (!window.isSecureContext) {
    why = 'Phones only share GPS with sites opened over a secure <b>https://</b> address. This page was opened without one.';
    how = 'fishforecast.net is still finishing its security certificate; location will work as soon as the site opens at <b>https://fishforecast.net</b>. Until then, use <b>Search a place</b>.';
  } else if (err && err.code === 1) {
    why = 'Location permission is turned off for this site.';
    how = ios ? '<b>iPhone:</b> Settings → Privacy &amp; Security → Location Services → turn it on, then Safari Websites (or Chrome) → <b>While Using</b>. In Safari, tap <b>aA</b> in the address bar → Website Settings → Location → <b>Allow</b>. Reload the page.'
      : android ? '<b>Android Chrome:</b> tap the icon left of the address → Permissions → Location → <b>Allow</b>. Also check Settings → Location is on and Chrome has location permission. Reload the page.'
      : 'Click the icon left of the address bar → Site settings → Location → <b>Allow</b>, then reload.';
  } else {
    why = err && err.code === 3 ? 'GPS took too long to get a fix.' : 'Your device couldn’t determine a location.';
    how = 'Make sure Location is on, step outside or near a window, and try again — or use <b>Search a place</b>.';
  }
  $('#sheet').innerHTML = `<div class="in"><div class="hrow"><h2 style="flex:1;margin:0">Location not available</h2><button class="btn sm ghost" data-close="1">Close</button></div>
   <p class="small" style="margin-top:10px">${why}</p><p class="small">${how}</p>
   <div class="row" style="margin-top:10px"><button class="btn" data-addspot2="1">Search a place</button><button class="btn ghost" data-close="1">OK</button></div></div>`;
  $('#sheet').classList.add('on');
}
locateMe = function () {

  getFix(c => { const el = $('#gpsProg'); if (el) el.textContent = gpsStatus(c); }).then(async c => {

    let best = null;
    for (const sp of spots()) { if (sp.lat == null) continue; const d = distKm([c.lat, c.lng], [sp.lat, sp.lng]) * 1000; if (!best || d < best.d) best = { s: sp, d }; }
    const near = Math.min(300, Math.max(80, c.acc * 2));
    if (best && best.d <= near) { state.spotId = best.s.id; state.settings.spotId = best.s.id; Store.saveSettings(); $('#sheet').classList.remove('on'); toast(`At ${best.s.name} (GPS ±${c.acc} m)`); render(); window.scrollTo(0, 0); return; }

const SHAPE = { deep: ['bream', 'redear', 'panfish-other', 'crappie', 'sheepshead', 'blackdrum', 'permit', 'pompano', 'tripletail', 'scup', 'perch', 'carp', 'jack', 'mahi'], slim: ['trout', 'striper', 'redfish', 'cobia', 'tarpon', 'weakfish', 'pike', 'musky', 'king', 'spanish', 'bluefish', 'albie', 'whiting', 'walleye', 'rainbow', 'brown', 'brook', 'laketrout', 'salmongl', 'salmonpac', 'shad', 'snook', 'lingcod'], flat: ['flounder', 'fluke', 'calhalibut', 'pachalibut'] };
function estWeight(id, inches) { // rough length→weight; varies with girth and season

async function runPhotoLog(file) {

    lines.push('📍 Getting your position…'); show();

  lines.push(`🎣 Spot: <b>${esc((spots().find(s => s.id === d.spot) || {}).name || '')}</b>${best && best.k >= 15 ? ' (nearest saved spot is far — add this place as a spot to track it)' : ''}`);

document.addEventListener('change', e => { if (e.target.id === 'plFile' && e.target.files && e.target.files[0]) runPhotoLog(e.target.files[0]); });
document.addEventListener('click', e => {

      length: d.length || '', weight: d.weight || '', notes: d.species === 'other' && d.name ? d.name : '', idBy: d.name ? { name: d.name, conf: d.conf } : null, lat: d.lat != null ? +d.lat.toFixed(5) : null, lng: d.lng != null ? +d.lng.toFixed(5) : null, _photoFile: d.file }, true);

// ---- "Right now" card ----
// a function declaration (not const) so it is hoisted: windEffect() in features3.js calls it during the first render, before this line runs

// Freshwater lakes rarely have a temperature sensor, so let the angler enter one.
