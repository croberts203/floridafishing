<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Fish Forecast — US fishing forecast, tides & marine</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#0b1a24;--panel:#11263a;--panel2:#16304a;--line:#24435f;--text:#e8f0f6;--muted:#93a9bb;--accent:#3fd0b5;--accent2:#f2b84b;--tide:#3b8fd9;--bad:#e86a5c;--good:#66d17a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(11,26,36,.94);backdrop-filter:blur(10px);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
h1 small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
h2{font-size:15px;margin:0 0 8px}
h3{font-size:14px;margin:12px 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;color:var(--muted);padding:6px 11px;border-radius:999px;font:600 13px inherit;font-family:inherit}
.seg button.on{background:var(--accent);color:#06221c}
select,input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:15px inherit;font-family:inherit;width:100%}
textarea{min-height:64px}
label{font-size:12.5px;color:var(--muted);display:block;margin:8px 0 4px}
main{padding:12px 12px 20px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin:0 0 12px}
.days{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:58px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px;color:var(--text);font-family:inherit}
.day b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.day span{display:block;font-size:17px;font-weight:700}
.day i{display:block;height:4px;border-radius:3px;margin-top:4px;background:var(--line)}
.day.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.row{display:flex;gap:8px}.row>*{flex:1}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 8px;border-radius:9px;font-weight:800;font-size:15px;color:#06221c}
.s0{background:#5c6e7c;color:#dfe7ee}.s1{background:#8aa0b2}.s2{background:var(--accent2)}.s3{background:#7fd88e}.s4{background:var(--accent)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.pick{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pick:first-of-type{border-top:0}
.pick .nm{flex:1;min-width:0}
.pick .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartwrap{position:relative;touch-action:pan-y}
svg text{font-family:inherit}
.readout{min-height:38px;font-size:13px;color:var(--muted);margin-top:4px}
.readout b{color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.kv b{display:block;font-size:16px}.kv span{font-size:12px;color:var(--muted)}
.tides{display:flex;flex-wrap:wrap;gap:8px}
.tide{background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:13px}
.tide b{font-size:14px}
.win{border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin:8px 0}
.win b{font-size:15px}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0}
.tag.hot{color:#06221c;background:var(--accent2);border-color:var(--accent2);font-weight:700}
.alert{background:rgba(242,184,75,.12);border:1px solid rgba(242,184,75,.45);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.sp{cursor:pointer}
.sp .det{display:none;margin-top:10px}
.sp.open .det{display:block}
.mbar{display:flex;gap:2px;margin:6px 0 2px}
.mbar i{flex:1;height:14px;border-radius:2px;background:var(--accent);opacity:.15}
.mbar i.cur{outline:1.5px solid var(--text)}

ul.ls{margin:4px 0 0;padding-left:18px}ul.ls li{margin:2px 0}

nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 8px;font:600 11.5px inherit;font-family:inherit}
nav button svg{display:block;margin:0 auto 2px;width:23px;height:23px}
nav button.on{color:var(--accent)}
.btn{border:0;border-radius:11px;padding:11px 14px;font:700 15px inherit;font-family:inherit;background:var(--accent);color:#06221c;width:100%}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{width:auto;padding:7px 12px;font-size:13px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--panel);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.catch{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.catch:first-child{border-top:0}
.catch .ic{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent)}
.catch .tx{flex:1;min-width:0}
.bars .b{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}
.bars .b span{width:92px;color:var(--muted)}
.bars .b i{height:10px;border-radius:3px;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#e8f0f6;color:#0b1a24;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;z-index:30;display:none}
a{color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin:3px 4px 3px 0;font-size:13px;color:var(--text);font-family:inherit}
.chip.on{background:var(--accent);color:#06221c;border-color:var(--accent);font-weight:700}
.spotrow{border-top:1px solid var(--line);padding:10px 0}
.spotrow .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hide{display:none!important}

// Season factor by region; Jacksonville-built species reuse their curve in the South Atlantic and Gulf.
function seasonFactor(sp, region, month) {
  if (sp.seasons && sp.seasons[region]) return sp.seasons[region][month] / 10;
  if (sp.season && (region === 'SA' || region === 'GULF' || region === 'SF')) return Math.max(.3, sp.season[month] / 10);
  return 0.85; // let water temperature decide
}
function speciesFits(sp, spot) {
  if (!sp.waters.includes(spot.water)) return false;
  const lat = spot.lat, lng = spot.lng;
  if (spot.water === 'fresh' || spot.water === 'greatlakes') {
    if (spot.water === 'greatlakes' && !['smallmouth', 'walleye', 'perch', 'pike', 'musky', 'rainbow', 'brown', 'laketrout', 'salmongl', 'whitebass', 'carp'].includes(sp.id)) return false;
    if (sp.lat && lat != null && (lat < sp.lat[0] || lat > sp.lat[1])) return false;
    if (sp.id === 'shad' && lng != null && lng > -117 && lng < -84) return false; // coastal rivers only
    if (sp.regions && !sp.regions.includes(regionOf(lat, lng, 'inshore'))) return false; // e.g. Pacific salmon rivers
    return true;
  }
  const reg = regionOf(lat, lng, spot.water);
  if (sp.regions && !sp.regions.includes(reg)) return false;
  if (sp.latMax && lat > sp.latMax) return false;
  if (sp.id === 'striper' && reg === 'PN' && lat > 44) return false; // West Coast stripers: SF Bay to Oregon
  if (!sp.regions) return false;
  return true;
}

function regJurisdiction(spot) {

}

// Forecast engine: spot tides, per-sample features, species scoring, catch-log patterns.
const Engine = (() => {
  const MIN = 60000, HR = 3600000, DAY = 864e5, STEP = 15 * MIN;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  function spotExtremes(spot, t0, t1) {
    if (spot.station && typeof natTideExtremes === 'function') return natTideExtremes(spot.station.id);
    if (!spot.tide) return [];
    const o = spot.tide;
    return Tide.extremes(TIDE_MODEL, t0 - 8 * HR, t1 + 8 * HR)
      .map(e => e.type === 'H' ? { t: e.t + o.hi * MIN, h: e.h * o.hr, ref: e.h, type: 'H' } : { t: e.t + o.lo * MIN, h: e.h * o.lr, ref: e.h, type: 'L' })
      .sort((a, b) => a.t - b.t);
  }
  function tideAt(ext, t) {
    for (let i = 0; i < ext.length - 1; i++) {
      const a = ext[i], b = ext[i + 1];
      if (t >= a.t && t < b.t) {
        const dur = b.t - a.t, fr = (t - a.t) / dur;
        const h = a.h + (b.h - a.h) * (1 - Math.cos(Math.PI * fr)) / 2;
        const dh = (b.h - a.h) * Math.PI / 2 * Math.sin(Math.PI * fr) / (dur / HR);
        const lowH = Math.min(a.h, b.h), highH = Math.max(a.h, b.h);
        return { h, dh, flood: b.type === 'H', fr, prev: a, next: b, hRel: highH > lowH ? (h - lowH) / (highH - lowH) : .5 };
      }
    }
    return null;
  }
  function stageLabel(ts) {
    if (!ts) return '—';
    if (ts.fr < 0.08) return ts.flood ? 'Slack low, turning in' : 'Slack high, turning out';
    if (ts.fr > 0.92) return ts.flood ? 'Top of the flood' : 'Bottom of the ebb';
    const part = ts.fr < 0.34 ? 'Early' : ts.fr < 0.67 ? 'Mid' : 'Late';
    return part + (ts.flood ? ' incoming' : ' outgoing');
  }
  function stageBin(ts) { if (!ts) return null; return (ts.flood ? 'In-' : 'Out-') + (ts.fr < 0.34 ? 'early' : ts.fr < 0.67 ? 'mid' : 'late'); }

  function lightBin(alt, morning) {
    if (alt < -6) return 'Night';
    if (alt < 10) return morning ? 'Dawn' : 'Dusk';
    if (alt < 35) return morning ? 'Morning' : 'Afternoon';
    return 'Midday';
  }

  // Build features for one local day at a spot
  function buildDay(t0, spot, loc) {
    const days = [-1, 0, 1].map(k => Astro.day(t0 + k * DAY, loc.lat, loc.lng));
    const ast = days[1];
    const majors = days.flatMap(d => d.transits.map(x => x.t));
    const minors = days.flatMap(d => [d.moonrise, d.moonset].filter(Boolean));
    const ext = spotExtremes(spot, t0, t0 + DAY);
    let maxRate = 0.01;
    const samples = [];
    for (let t = t0; t < t0 + DAY; t += STEP) {
      const ts = ext.length ? tideAt(ext, t) : null;
      if (ts) maxRate = Math.max(maxRate, Math.abs(ts.dh));
      const alt = Astro.sunAlt(t, loc.lat, loc.lng);
      const noon = ast.sunrise && ast.sunset ? (ast.sunrise + ast.sunset) / 2 : t0 + 12 * HR;
      const dMaj = Math.min(...majors.map(m => Math.abs(t - m))) / MIN;
      const dMin = minors.length ? Math.min(...minors.map(m => Math.abs(t - m))) / MIN : 999;
      samples.push({ t, ts, alt, morning: t < noon, dMaj, dMin });
    }
    const phaseBoost = 0.82 + 0.18 * Math.abs(Math.cos(2 * Math.PI * ast.phase));
    for (const s of samples) {
      const sMaj = Math.max(0, 1 - Math.max(0, s.dMaj - 45) / 90);
      const sMin = 0.72 * Math.max(0, 1 - Math.max(0, s.dMin - 30) / 60);
      s.sol = Math.max(0.25, sMaj, sMin) * phaseBoost;
      s.solTag = s.dMaj <= 60 ? 'Major solunar' : s.dMin <= 45 ? 'Minor solunar' : '';
      s.cs = s.ts ? Math.abs(s.ts.dh) / maxRate : 0;
      s.lbin = lightBin(s.alt, s.morning);
    }
    // full-moon proximity in days
    const ph = ast.phase, dFull = Math.abs(ph - 0.5) * 29.53, dNew = Math.min(ph, 1 - ph) * 29.53;
    return { t0, spot, ast, ext: ext.filter(e => e.t >= t0 && e.t < t0 + DAY), extAll: ext, samples, majors, minors, dFull, dNew };
  }

  function lightScore(sp, s) {
    const [dawn, day, dusk, night] = sp.light, a = s.alt, edge = s.morning ? dawn : dusk;
    if (a < -12) return night;
    if (a < -6) return night + (edge - night) * (a + 12) / 6;
    if (a < 10) return edge;
    if (a < 25) return edge + (day - edge) * (a - 10) / 15;
    return day;
  }

  function weatherFactor(sp, c, fly) {
    let w = 1;
    const p = { ff: .15, f: .08, s: 0, r: -.04, pf: -.2 }[c.pressure || 's'] || 0;
    w += p * sp.ps;
    const tol = sp.wt * (fly ? 0.65 : 1), wind = +c.wind || 0;
    if (wind > tol) w -= Math.min(0.5, (wind - tol) * 0.03);
    if (c.clarity === 'clear') w += 0.05 * sp.sight * (fly ? 2 : 1);
    if (c.clarity === 'muddy') w -= 0.25 * sp.sight + (fly ? 0.1 : 0);
    if (c.sky === 'overcast') w += 0.05 * (1 - sp.sight) - 0.1 * sp.sight * (fly ? 1 : .5);
    if (c.sky === 'sun') w += 0.05 * sp.sight;
    if (c.sky === 'rain') w -= 0.03;
    return clamp(w, 0.4, 1.25);
  }
  function tempFactor(sp, wt) {
    const [mn, lo, hi, mx] = sp.temp;
    if (wt == null || isNaN(wt)) return 1;
    if (wt <= mn || wt >= mx) return 0.12;
    if (wt < lo) return 0.12 + 0.88 * (wt - mn) / (lo - mn);
    if (wt > hi) return 0.12 + 0.88 * (mx - wt) / (mx - hi);
    return 1;
  }

  // personal multipliers from catch log
  function patterns(catches, spId) {
    const list = catches.filter(c => c.species === spId && c.cond);
    if (list.length < 5) return null;
    const cnt = (key, bins) => { const m = {}; bins.forEach(b => m[b] = 1); list.forEach(c => { const v = c.cond[key]; if (v in m) m[v] += 1; }); const tot = Object.values(m).reduce((a, b) => a + b, 0); for (const k in m) m[k] = m[k] / tot * bins.length; return m; };
    return { n: list.length, tide: cnt('stageBin', ['In-early', 'In-mid', 'In-late', 'Out-early', 'Out-mid', 'Out-late']), light: cnt('lbin', ['Dawn', 'Morning', 'Midday', 'Afternoon', 'Dusk', 'Night']) };
  }

  function scoreSpecies(day, sp, cond, opts) {
    const month = new Date(day.t0 + 12 * HR).getMonth();
    const salt = !['fresh', 'greatlakes'].includes(day.spot.water);
    const wt = cond.wtemp !== '' && cond.wtemp != null ? +cond.wtemp : WATER_TEMP[salt ? 'salt' : 'fresh'][month];
    const season = opts.region && typeof seasonFactor === 'function' ? seasonFactor(sp, opts.region, month) : sp.season[month] / 10;
    const tf = tempFactor(sp, wt), wf = weatherFactor(sp, cond, opts.fly);
    const ff = opts.fly ? 0.3 + 0.7 * sp.fly.r / 3 : 1;
    let bed = 1;
    if (sp.moonBed && month >= 3 && month <= 7 && day.dFull <= 4) bed = 1.2;
    const pat = opts.usePatterns ? patterns(opts.catches || [], sp.id) : null;
    const useTide = sp.tide && day.ext.length;
    const out = []; let tailFlag = null;
    for (const s of day.samples) {
      const ls = lightScore(sp, s);
      let tsc = 0.6;
      if (useTide && s.ts) {
        const T = sp.tide;
        tsc = T.m * s.cs + (1 - T.m) * 0.55;
        tsc *= 1 + 0.3 * T.fb * (s.ts.flood ? 1 : -1);
        tsc *= 1 + 0.25 * T.hw * (2 * s.ts.hRel - 1);
        // tailing redfish on big flood tides into the spartina (Apr–Nov)
        if (sp.tailing && s.ts.flood && s.ts.hRel > 0.65 && month >= 3 && month <= 10) {
          const refHigh = s.ts.next.ref;
          if (refHigh >= 5.3) { tsc = Math.max(tsc, opts.fly ? 1.1 : 0.95); tailFlag = tailFlag || { t: s.ts.next.t, h: s.ts.next.h }; }
        }
        tsc = clamp(tsc, 0.05, 1.1);
      }
      let raw = useTide ? 0.12 + 0.36 * tsc + 0.24 * s.sol + 0.28 * ls : 0.12 + 0.4 * s.sol + 0.48 * ls;
      let pf = 1;
      if (pat) {
        const tb = s.ts ? stageBin(s.ts) : null;
        const a = tb && pat.tide[tb] ? Math.pow(pat.tide[tb], 0.35) : 1, b = pat.light[s.lbin] ? Math.pow(pat.light[s.lbin], 0.35) : 1;
        pf = clamp(a * b, 0.8, 1.25);
      }
      const v = clamp(100 * season * tf * wf * ff * bed * raw * pf, 0, 100);
      out.push({ t: s.t, v, tsc, ls, sol: s.sol });
    }
    // best 2-hour window
    let best = 0, bestI = 0; const W = 8;
    for (let i = 0; i + W <= out.length; i++) { let m = 0; for (let j = i; j < i + W; j++) m += out[j].v; m /= W; if (m > best) { best = m; bestI = i; } }
    return { sp, series: out, day: best, bestStart: out[bestI].t, bestEnd: out[bestI].t + W * STEP, season, tf, wf, wt, tail: tailFlag, pat, bed: bed > 1 };
  }

  function windows(res, day, n = 3) {
    const s = res.series, max = Math.max(...s.map(x => x.v)); if (max <= 0) return [];
    const thr = max * 0.82, wins = [];
    let i = 0;
    while (i < s.length) {
      if (s[i].v >= thr) { let j = i, pk = i; while (j < s.length && s[j].v >= thr) { if (s[j].v > s[pk].v) pk = j; j++; } wins.push({ a: s[i].t, b: s[j - 1].t + STEP, peak: s[pk].v, pk: s[pk].t, idx: pk }); i = j; } else i++;
    }
    wins.sort((a, b) => b.peak - a.peak);
    return wins.slice(0, n).map(w => {
      const smp = day.samples[w.idx], why = [];
      if (smp.ts && res.sp.tide) why.push(stageLabel(smp.ts).toLowerCase() + ' tide');
      if (smp.solTag) why.push(smp.solTag.toLowerCase());
      if (smp.lbin === 'Dawn' || smp.lbin === 'Dusk') why.push(smp.lbin === 'Dawn' ? 'first light' : 'last light');
      if (smp.lbin === 'Night' && res.sp.light[3] > .6) why.push('night bite');
      if (smp.lbin === 'Midday' && res.sp.sight > .7) why.push('high sun for spotting');
      return { ...w, why };
    }).sort((a, b) => a.a - b.a);
  }

  function rating(v) { return v >= 70 ? ['Great', 4] : v >= 50 ? ['Good', 3] : v >= 30 ? ['Fair', 2] : v >= 12 ? ['Slow', 1] : ['Poor', 0]; }

  return { buildDay, scoreSpecies, windows, tideAt, stageLabel, stageBin, rating, patterns, spotExtremes, DAY, HR, STEP };
})();

// ===== Standalone website extras (floridafishing.com): live NWS marine forecast, GPS =====
const NWS = (() => {
  const DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
  const cap = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  // Expand a UGC line like "AMZ450-452-454-191500-" or "AMZ450>454-" into zone ids
  function ugcZones(line) {
    const out = []; let pre = '';
    for (const tok of line.split('-')) {
      const m = tok.match(/^([A-Z]{2}Z)?(\d{3})(?:>(\d{3}))?$/);
      if (!m) continue;
      if (m[1]) pre = m[1];
      if (!pre) continue;
      const a = +m[2], b = m[3] ? +m[3] : a;
      for (let i = a; i <= b; i++) out.push(pre + String(i).padStart(3, '0'));
    }

  const maj = day.majors.filter(t => t >= state.day0 && t < state.day0 + 864e5).sort((x, y) => x - y);
  const mins = day.minors.filter(t => t >= state.day0 && t < state.day0 + 864e5).sort((x, y) => x - y);
  html += `<div class="card"><h2>Sun, moon & solunar</h2><div class="grid2">
   <div class="kv"><b>${fmtT(a.sunrise)}</b><span>Sunrise (first light ${fmtT(a.dawn)})</span></div><div class="kv"><b>${fmtT(a.sunset)}</b><span>Sunset (last light ${fmtT(a.dusk)})</span></div>
   <div class="kv"><b>${esc(a.phaseName)}</b><span>${Math.round(a.illum * 100)}% illuminated</span></div><div class="kv"><b>${fmtT(a.moonrise)} / ${fmtT(a.moonset)}</b><span>Moonrise / moonset</span></div></div>
   <div style="margin-top:8px">${maj.map(t => `<span class="tag hot">Major ${fmtT(t - 3600e3)}–${fmtT(t + 3600e3)}</span>`).join('')}${mins.map(t => `<span class="tag">Minor ${fmtT(t - 2700e3)}–${fmtT(t + 2700e3)}</span>`).join('')}</div>
   <div class="note">Majors are when the moon is overhead or underfoot; minors are moonrise and moonset. ${Math.min(day.dFull, day.dNew) < 3 ? 'Near a new or full moon these periods tend to be stronger.' : ''}</div></div>`;
  html += viewMarine();

}

function viewPickSpot() {

function chartSVG(day, r) {
  const W = 360, H = 170, L = 26, R = 8, T = 8, B = 22, cw = W - L - R, ch = H - T - B;
  const x = t => L + (t - day.t0) / 864e5 * cw;
  const ys = v => T + ch - v / 100 * ch;
  let g = '';
  // night shading
  const a = day.ast;
  if (a.dawn) g += `<rect x="${L}" y="${T}" width="${x(a.dawn) - L}" height="${ch}" fill="#000" opacity=".3"/>`;
  if (a.dusk) g += `<rect x="${x(a.dusk)}" y="${T}" width="${L + cw - x(a.dusk)}" height="${ch}" fill="#000" opacity=".3"/>`;
  // solunar
  day.majors.forEach(t => { const a1 = Math.max(day.t0, t - 3600e3), b1 = Math.min(day.t0 + 864e5, t + 3600e3); if (b1 > a1) g += `<rect x="${x(a1)}" y="${T}" width="${x(b1) - x(a1)}" height="${ch}" fill="var(--accent2)" opacity=".22"/>`; });
  day.minors.forEach(t => { const a1 = Math.max(day.t0, t - 2700e3), b1 = Math.min(day.t0 + 864e5, t + 2700e3); if (b1 > a1) g += `<rect x="${x(a1)}" y="${T}" width="${x(b1) - x(a1)}" height="${ch}" fill="var(--accent2)" opacity=".1"/>`; });
  // tide
  if (day.ext.length) {
    const pts = []; let mn = Infinity, mx = -Infinity;
    for (let t = day.t0; t <= day.t0 + 864e5; t += 10 * 60000) { const ts = Engine.tideAt(day.extAll, t); if (ts) { pts.push([t, ts.h]); mn = Math.min(mn, ts.h); mx = Math.max(mx, ts.h); } }
    mn = Math.min(mn, 0) - .3; mx = mx + .3;
    const yt = h => T + ch - (h - mn) / (mx - mn) * ch;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + yt(p[1]).toFixed(1)).join('');
    g += `<path d="${d} L${x(pts[pts.length - 1][0])} ${T + ch} L${x(pts[0][0])} ${T + ch}Z" fill="var(--tide)" opacity=".22"/><path d="${d}" fill="none" stroke="var(--tide)" stroke-width="1.5" opacity=".8"/>`;
    for (let f = Math.ceil(mn); f <= mx; f += 2) g += `<text x="${W - 2}" y="${yt(f) + 3}" font-size="8.5" fill="var(--tide)" text-anchor="end">${f}ft</text>`;
  }
  // score
  const sd = r.series.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + ys(p.v).toFixed(1)).join('');
  g += `<path d="${sd}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
  // axes
  for (let v = 0; v <= 100; v += 50) g += `<line x1="${L}" x2="${L + cw}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${L - 4}" y="${ys(v) + 3}" font-size="9" fill="var(--muted)" text-anchor="end">${v}</text>`;
  for (let h = 0; h <= 24; h += 3) { const t = day.t0 + h * 3600e3; g += `<text x="${x(t)}" y="${H - 6}" font-size="9" fill="var(--muted)" text-anchor="middle">${h === 0 || h === 24 ? '12a' : h === 12 ? '12p' : h > 12 ? (h - 12) + 'p' : h + 'a'}</text>`; }
  const now = Date.now();
  if (now >= day.t0 && now < day.t0 + 864e5) g += `<line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${T + ch}" stroke="var(--text)" stroke-width="1" opacity=".6"/>`;
  g += `<line id="cursor" x1="0" x2="0" y1="${T}" y2="${T + ch}" stroke="var(--text)" stroke-width="1" opacity="0"/>`;
  return `<svg id="chart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
}
function bindChart() {
  const svg = $('#chart'); if (!svg) return;
  const handler = ev => {
    const rect = svg.getBoundingClientRect(), px = (ev.clientX - rect.left) / rect.width * 360;
    const fr = Math.max(0, Math.min(1, (px - 26) / (360 - 34)));
    const { day, res } = scoreAll(state.day0), r = chosen(res);
    const i = Math.min(r.series.length - 1, Math.round(fr * (r.series.length - 1))), p = r.series[i], s = day.samples[i];
    const c = $('#cursor'); c.setAttribute('x1', 26 + fr * 326); c.setAttribute('x2', 26 + fr * 326); c.setAttribute('opacity', '.7');
    $('#readout').innerHTML = `<b>${fmtT(p.t)}</b> · score <b>${Math.round(p.v)}</b>${s.ts ? ` · ${s.ts.h.toFixed(1)} ft, ${Engine.stageLabel(s.ts).toLowerCase()}` : ''}${s.solTag ? ' · ' + s.solTag.toLowerCase() : ''} · ${s.lbin.toLowerCase()}`;
  };

}

  };
  return bars('Tide stage', 'stageBin', ['In-early', 'In-mid', 'In-late', 'Out-early', 'Out-mid', 'Out-late']) + bars('Time of day', 'lbin', ['Dawn', 'Morning', 'Midday', 'Afternoon', 'Dusk', 'Night']) +

function csv() {
  const cols = ['date', 'time', 'species', 'count', 'length_in', 'weight_lb', 'method', 'bait', 'spot', 'spot_detail', 'kept', 'tide_stage', 'tide_ft', 'solunar', 'moon', 'light', 'pressure', 'wind_mph', 'sky', 'clarity', 'water_temp_f', 'lat', 'lon', 'notes'];
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = state.catches.map(c => { const k = c.cond || {}; return [dkey(c.ts), new Date(c.ts).toTimeString().slice(0, 5), SPMAP[c.species] ? SPMAP[c.species].name : c.species, c.count, c.length, c.weight, c.method, c.bait, c.spotName, c.where, c.kept ? 'kept' : 'released', k.stage, k.tideFt, k.sol, k.moon, k.lbin, k.pressure, k.wind, k.sky, k.clarity, k.wtemp, c.lat, c.lng, c.notes].map(q).join(','); });
  return [cols.join(',')].concat(rows).join('\n');
}

// ===== Fish ID (photo → Claude) =====
let idFile = null, idCtl = null, idResult = null;
function openFishId() {
  idFile = null; idResult = null;
  $('#sheet').innerHTML = `<div class="in"><div class="hrow"><h2 style="flex:1;margin:0">Identify a fish</h2><button class="btn sm ghost" data-close="1">Close</button></div>
   <div class="small muted" style="margin:6px 0 10px">Take a photo or pick one from your library. A clear side view, whole fish, with the tail visible, works best. Lay it next to a ruler or bump board if you want a length estimate.</div>
   <label class="btn ghost" style="display:block;text-align:center">📷 Take or choose photo<input id="idFile" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/*" style="display:none"></label>
   <img id="idPrev" alt="" style="display:none;width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:10px;background:#000">
   <div style="margin-top:10px"><button class="btn" id="idGo" data-idgo="1" disabled>Identify</button></div>
   <div id="idOut" style="margin-top:12px"></div></div>`;
  $('#sheet').classList.add('on');

async function runFishId() {
  if (!idFile || !state.sample) return;
  const out = $('#idOut'), go = $('#idGo'); go.disabled = true; go.textContent = 'Looking…';
  out.innerHTML = '<div class="muted">Thinking… (this can take up to a minute)</div>';
  idCtl = new AbortController();
  const list = SPECIES.map(s => `${s.id}: ${s.name}`).join('\n');
  const prompt = `An angler near Jacksonville, Florida photographed this fish (waters: St. Johns River fresh and brackish, Intracoastal Waterway, Atlantic surf, nearshore and offshore). Identify the species from the photo.
If it matches one of these app species ids, use that id; otherwise use "other":
${list}
Reply with only a JSON object:
{"is_fish": true, "id": "redfish", "common_name": "Red drum", "scientific_name": "Sciaenops ocellatus", "confidence": 0.9, "key_features": ["up to 4 short visible features you used"], "look_alikes": [{"name": "Black drum", "how_to_tell": "short tip"}], "estimated_length_in": null, "photo_note": "short note on photo quality or what would confirm the ID"}
confidence is 0–1. Only give estimated_length_in when a ruler or measuring board is clearly readable in the photo; otherwise null. If the photo is not a fish, set is_fish false.`;
  try {
    const r = await state.sample.json(prompt, { images: [idFile], signal: idCtl.signal });
    idResult = r || {};
    if (r && r.is_fish === false) { out.innerHTML = '<div class="alert">That doesn’t look like a fish photo. Try a clearer side view.</div>'; return; }
    const id = SPMAP[r.id] ? r.id : null, conf = Math.round(Math.max(0, Math.min(1, +r.confidence || 0)) * 100);
    const st = id ? regStatus(id, Date.now()) : { open: true };
    out.innerHTML = `<div class="card" style="margin:0"><div class="hrow"><div style="flex:1"><b style="font-size:17px">${esc(r.common_name || (id && SPMAP[id].name) || 'Unknown')}</b><div class="small muted"><i>${esc(r.scientific_name || '')}</i></div></div><span class="score ${conf >= 80 ? 's4' : conf >= 55 ? 's2' : 's1'}">${conf}%</span></div>
      ${conf < 60 ? '<div class="alert" style="margin-top:8px">Low confidence — check the look-alikes below before you keep it.</div>' : ''}
      ${Array.isArray(r.key_features) && r.key_features.length ? `<h3>What gave it away</h3><ul class="ls">${r.key_features.slice(0, 4).map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
      ${Array.isArray(r.look_alikes) && r.look_alikes.length ? `<h3>Look-alikes</h3><ul class="ls">${r.look_alikes.slice(0, 3).map(l => `<li><b>${esc(l.name)}</b> — ${esc(l.how_to_tell)}</li>`).join('')}</ul>` : ''}
      ${r.estimated_length_in ? `<div class="small" style="margin-top:6px">Estimated length from the ruler: <b>${esc(r.estimated_length_in)}"</b> — measure it yourself before keeping.</div>` : ''}
      ${r.photo_note ? `<div class="note">${esc(r.photo_note)}</div>` : ''}
      ${id ? `<h3>Rules ${st.open ? '' : '<span class="tag" style="background:var(--bad);color:#fff;border-color:var(--bad)">Closed until ' + esc(st.until) + '</span>'}</h3>${regsBody(id)}` : '<div class="note">Not one of the app’s species — check MyFWC.com for its rules.</div>'}
      <div style="margin-top:10px"><button class="btn" data-idlog="1">Log this catch</button></div>
      <div class="note">Photo ID is a best guess by Claude, not a legal identification. You are responsible for knowing what you keep.</div></div>`;
  } catch (e) {
    const code = e && e.code;
    const msg = { not_granted: 'Fish ID needs your OK to use Claude — allow it when asked and try again.', rate_limited: 'Too many requests right now — try again in a minute.', image_rejected: 'That photo couldn’t be read — try a JPEG or a smaller photo.', invalid_json: 'Got an unclear answer — tap Identify again.', images_unavailable: 'Photo ID isn’t available in this view.', cancelled: '' }[code] ?? 'Something went wrong — try again.';
    out.innerHTML = msg ? `<div class="alert">${msg}</div>` : '';
    if (code === 'not_granted' || code === 'images_unavailable' || code === 'sampling_disabled') { state.sample = null; }
  } finally { go.disabled = false; go.textContent = 'Identify again'; }
}

document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'spotSel') { state.spotId = e.target.value; state.settings.spotId = state.spotId; if (state.spId !== 'auto' && !eligible(spot()).find(s => s.id === state.spId)) state.spId = 'auto'; Store.saveSettings(); render(); }
  else if (id === 'spSel') { state.spId = e.target.value; render(); }
  else if (id === 'datePick') { const [y, m, dd] = e.target.value.split('-').map(Number); if (y) { state.day0 = new Date(y, m - 1, dd).getTime(); render(); } }
  else if (['cPress', 'cWind', 'cTemp', 'cSky', 'cClar'].includes(id)) {

    c.pressure = $('#cPress').value; c.wind = $('#cWind').value === '' ? '' : +$('#cWind').value; c.wtemp = $('#cTemp').value; c.sky = $('#cSky').value; c.clarity = $('#cClar').value;
    state.settings.cond = { ...state.settings.cond, [k]: c };
    // keep only the last ~60 days of condition entries
    const keys = Object.keys(state.settings.cond).sort(); while (keys.length > 60) delete state.settings.cond[keys.shift()];
    Store.saveSettings(); const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  else if (id === 'fTs' || id === 'fSpot') updCond();
  else if (id === 'idFile') { const f = e.target.files && e.target.files[0]; if (f) { idFile = f; const im = $('#idPrev'); im.src = URL.createObjectURL(f); im.style.display = 'block'; $('#idGo').disabled = false; $('#idOut').innerHTML = ''; } }
  else if (id === 'usePat') { state.settings.usePatterns = e.target.checked; Store.saveSettings(); }
  else if (e.target.dataset.off) {

    if (cu) cu.tide = { ...cu.tide, [k]: v };

});

// Deep links: #forecast, #marine, #species, #regulations, #log, #fishid, #settings
function applyHash() {
  const h = (location.hash || '').slice(1).toLowerCase();
  const map = { forecast: 'forecast', marine: 'forecast', boating: 'forecast', species: 'species', regulations: 'species', rules: 'species', log: 'log', catchlog: 'log', fishid: 'log', settings: 'settings' };
  if (!map[h]) return;
  state.tab = map[h]; render();
  if (h === 'marine' || h === 'boating') setTimeout(() => { const el = document.getElementById('marine'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 300);
  else window.scrollTo(0, 0);

async function shrink(file) {
  const bmp = await createImageBitmap(file); const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.85);
}
let photoDraft = null;
function openPhotoLog() {
  photoDraft = null;
  $('#sheet').innerHTML = `<div class="in"><div class="hrow"><h2 style="flex:1;margin:0">Log a catch from a photo</h2><button class="btn sm ghost" data-close="1">Close</button></div>
   <div class="small muted" style="margin:6px 0 10px">Take a photo or pick one from your library. Side view, whole fish, next to a ruler or bump board if you want a length. The app reads the photo’s time and location when they’re saved in it, and fills in tide, moon and weather for that moment.</div>
   <label class="btn" style="display:block;text-align:center">📷 Take or choose photo<input id="plFile" type="file" accept="image/*" style="display:none"></label>
   <img id="plPrev" alt="" style="display:none;width:100%;max-height:280px;object-fit:contain;border-radius:12px;margin-top:10px;background:#000">
   <div id="plOut" style="margin-top:10px"></div></div>`;
  $('#sheet').classList.add('on');
}
async function runPhotoLog(file) {
  const out = $('#plOut'); const im = $('#plPrev'); im.src = URL.createObjectURL(file); im.style.display = 'block';
  const lines = []; const show = extra => { out.innerHTML = `<div class="small">${lines.join('<br>')}</div>${extra || ''}`; };
  let exif = {}; try { exif = readExif(await file.arrayBuffer()); } catch (e) { }
  const d = { ts: exif.time || Date.now(), tsSrc: exif.time ? 'photo' : 'now', lat: exif.lat, lng: exif.lng, posSrc: exif.lat != null ? 'photo' : '' };
  lines.push(`🕒 ${d.tsSrc === 'photo' ? 'Taken' : 'Time'}: <b>${fmtD(d.ts)} ${fmtT(d.ts)}</b>${d.tsSrc === 'photo' ? ' (from photo)' : ' (now — the photo had no time)'}`);
  show();
  if (d.lat == null && navigator.geolocation && Math.abs(Date.now() - d.ts) < 3 * 3600e3) {
    lines.push('📍 Getting your position…'); show();
    await new Promise(res => navigator.geolocation.getCurrentPosition(p => { d.lat = p.coords.latitude; d.lng = p.coords.longitude; d.posSrc = 'GPS'; res(); }, () => res(), { enableHighAccuracy: true, timeout: 12000, maximumAge: 120000 }));
    lines.pop();
  }
  lines.push(d.lat != null ? `📍 Location: <b>${d.lat.toFixed(4)}, ${d.lng.toFixed(4)}</b> (${d.posSrc === 'photo' ? 'from photo' : 'your GPS'})` : '📍 No location in the photo — the catch goes to your selected spot.');
  // nearest saved spot
  let best = null; if (d.lat != null) for (const s of spots()) { if (s.lat == null) continue; const k = distKm([d.lat, d.lng], [s.lat, s.lng]); if (!best || k < best.k) best = { s, k }; }
  d.spot = best && best.k < 15 ? best.s.id : state.spotId;
  lines.push(`🎣 Spot: <b>${esc((spots().find(s => s.id === d.spot) || {}).name || '')}</b>${best && best.k >= 15 ? ' (nearest saved spot is far — add this place as a spot to track it)' : ''}`);
  show();
  // species + length from the photo
  if (Cloud.user && Cloud.sb) {
    lines.push('🔎 Identifying the fish…'); show();
    try {
      const img = await shrink(file);
      const sp = spots().find(s => s.id === d.spot) || spot();
      const pool = SPECIES.filter(s => sp.lat == null || speciesFits(s, sp)); const list = (pool.length ? pool : SPECIES).map(s => `${s.id}: ${s.name}`);
      const { data: sess } = await Cloud.sb.auth.getSession();
      const r = await fetch(SB_URL + '/functions/v1/catch-photo', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sess.session.access_token, apikey: SB_KEY }, body: JSON.stringify({ image: img, media_type: 'image/jpeg', species: list, region: (REGION_LABEL[spotRegion(sp)] || 'the US') + (natState(sp) ? ', ' + natState(sp) : '') }) });
      const j = await r.json(); lines.pop();
      if (!r.ok) lines.push('⚠️ ' + esc(j.message || 'Photo ID unavailable — pick the species yourself.'));
      else if (j.is_fish === false) lines.push('⚠️ That doesn’t look like a fish — pick the species yourself.');
      else {
        d.species = SPMAP[j.id] ? j.id : 'other'; d.name = j.common_name; d.conf = +j.confidence || 0; d.length = j.length_in || '';
        lines.push(`🐟 <b>${esc(j.common_name || 'Unknown')}</b> · ${Math.round(d.conf * 100)}% sure${j.key_features && j.key_features.length ? ' — ' + esc(j.key_features.slice(0, 2).join(', ')) : ''}`);
        if (d.length) lines.push(`📏 About <b>${esc(d.length)}"</b>${j.length_basis ? ' (measured against ' + esc(j.length_basis) + ')' : ''} — check it yourself`);
        else lines.push('📏 No ruler in the photo, so no length estimate — measure and enter it.');
        if (d.length && d.species !== 'other') { d.weight = estWeight(d.species, d.length); if (d.weight) lines.push(`⚖️ Roughly <b>${d.weight} lb</b> (estimated from length)`); }
        if (j.look_alikes && j.look_alikes[0] && j.look_alikes[0].name) lines.push(`<span class="muted">Look-alike: ${esc(j.look_alikes[0].name)} — ${esc(j.look_alikes[0].how_to_tell || '')}</span>`);
      }
    } catch (e) { lines.pop(); lines.push('⚠️ Photo ID failed — check your connection, or pick the species yourself.'); }
  } else lines.push('🔒 <b>Sign in</b> (Catch log tab) to identify the species and length from the photo. You can still log it now.');
  photoDraft = d;
  const spx = spots().find(s => s.id === d.spot) || spot();
  const where = d.lat != null ? { lat: d.lat, lng: d.lng, water: spx.water } : spx;
  for (let i = 0; i < 25 && where.lat != null && !natPoint(where); i++) await new Promise(r => setTimeout(r, 200)); // state lookup
  const stCode = where.lat != null ? natState(where) : null;
  if (stCode) lines.push(`📜 Rules: <b>${esc((STATE_REGS[stCode] || [stCode])[0])}</b>`);
  const rulesHtml = d.species && d.species !== 'other' ? (() => { const st = stCode === 'FL' ? regStatus(d.species, d.ts) : { open: true }; return `<div class="card" style="margin:12px 0 0"><div class="hrow"><b style="flex:1">Local rules: ${esc(SPMAP[d.species].name)}</b>${stCode === 'FL' ? (st.open ? '<span class="score s4" style="font-size:12px">OPEN</span>' : '<span class="score" style="background:var(--bad);color:#fff;font-size:12px">CLOSED</span>') : ''}</div>${!st.open ? `<div class="alert" style="margin-top:8px">Harvest is closed until ${esc(st.until)} — release it.</div>` : ''}${stCode && stCode !== 'FL' ? stateRegsBody(stCode, spx) : stCode === 'FL' ? regsBody(d.species, spx) : '<div class="small muted">Couldn’t work out which state you’re in — check your state’s rules.</div>'}${d.length && REGS[d.species] && stCode === 'FL' ? `<div class="note">Your fish: about ${esc(d.length)}" — compare with the size limit above and measure before keeping.</div>` : ''}</div>`; })() : (d.name ? `<div class="note">Check ${esc((STATE_REGS[stCode] || ['your state'])[0])} rules for ${esc(d.name)} before keeping it.</div>` : '');
  show(rulesHtml + `<div style="margin-top:12px"><button class="btn" data-photocontinue="1">Continue to log this catch</button></div><div class="note">Tide, solunar, moon and weather for that time are recorded automatically.</div>`);
}
document.addEventListener('change', e => { if (e.target.id === 'plFile' && e.target.files && e.target.files[0]) runPhotoLog(e.target.files[0]); });
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.photolog) { openPhotoLog(); return; }
  if (t.dataset.photocontinue && photoDraft) {
    const d = photoDraft;
    openCatch({ id: 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: d.ts, species: d.species || '', spot: d.spot, method: state.fly ? 'fly' : 'conv', count: 1, kept: false,
      length: d.length || '', weight: d.weight || '', notes: d.species === 'other' && d.name ? d.name : '', idBy: d.name ? { name: d.name, conf: d.conf } : null, lat: d.lat != null ? +d.lat.toFixed(5) : null, lng: d.lng != null ? +d.lng.toFixed(5) : null }, true);
  }
});

// ---- "Right now" card ----
const compass = d => d == null ? '' : ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'][Math.round(d / 22.5) % 16];
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 2 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
const utc = s => Date.parse(s.includes('T') ? s : s.replace(' ', 'T') + ':00Z');
function viewNow() {
  const sp = spot(); if (sp.lat == null) return '';
  if (state.day0 !== midnight(Date.now())) return '';
  const n = natNow(sp);
  if (!n) return `<div class="card"><h2>Right now</h2><div class="small muted">Loading live gauges and buoys…</div>${lakeBox(sp)}</div>`;
  const rows = [];
  const lake = lakeBox(sp);
  const kv = (big, label, sub) => `<div class="kv"><b>${big}</b><span>${label}${sub ? '<br>' + sub : ''}</span></div>`;
  const fresh = sp.water === 'fresh', c = fresh ? null : n.coops, b = fresh ? null : n.buoy, u = n.usgs;
  if (c && c.waterLevel) {
    const dv = c.waterLevel.predicted != null ? c.waterLevel.ft - c.waterLevel.predicted : null;
    rows.push(kv(`${c.waterLevel.ft.toFixed(1)} ft`, 'Water level now', dv != null && Math.abs(dv) >= 0.2 ? `<span style="color:var(--accent2)">${dv > 0 ? '+' : ''}${dv.toFixed(1)} ft vs. predicted</span>` : dv != null ? 'on prediction' : ''));
  }
  const wt = liveWaterTemp(sp); if (wt) rows.push(kv(`${wt.v}°F`, sp.water === 'fresh' ? 'River gauge temp' : 'Water temp', esc(wt.src)));
  const w = c && c.wind ? { mph: c.wind.mph, g: c.wind.gustMph, dir: c.wind.dir } : b && b.windMph != null ? { mph: b.windMph, g: b.gustMph, dir: compass(b.windDeg) } : null;
  if (w) rows.push(kv(`${Math.round(w.mph)} mph`, 'Wind ' + esc(w.dir || ''), w.g ? 'gusts ' + Math.round(w.g) : ''));
  if (b && b.waveFt != null) rows.push(kv(`${b.waveFt} ft`, 'Waves', `${b.periodS ? b.periodS + ' s period · ' : ''}${esc(b.name)}`));
  const pres = c && c.pressureMb ? c.pressureMb.v : b && b.pressureMb; if (pres) rows.push(kv(`${(pres * 0.02953).toFixed(2)} in`, 'Barometer', b && b.pressureTendMb != null ? `${b.pressureTendMb > 0 ? 'rising' : b.pressureTendMb < 0 ? 'falling' : 'steady'} ${Math.abs(b.pressureTendMb).toFixed(1)} mb/3h` : ''));
  if (u && u.flowCfs) rows.push(kv(`${Math.round(u.flowCfs.v).toLocaleString()} cfs`, 'River flow', esc(u.name)));
  if (u && u.gageFt && (sp.water === 'fresh' || !c)) rows.push(kv(`${u.gageFt.v.toFixed(2)} ft`, 'Gage height', esc(u.name)));
  if (!rows.length) return `<div class="card"><h2>Right now</h2><div class="small muted">No live gauges or buoys reporting near this spot.</div>${lake}</div>`;
  const times = [c && c.waterLevel && utc(c.waterLevel.t), b && utc(b.t), u && (u.flowCfs || u.gageFt) && Date.parse((u.flowCfs || u.gageFt).t)].filter(Boolean);
  const dv = c && c.waterLevel && c.waterLevel.predicted != null ? c.waterLevel.ft - c.waterLevel.predicted : 0;
  const note = Math.abs(dv) >= 0.5 ? `<div class="alert" style="margin-top:8px">Water is running ${Math.abs(dv).toFixed(1)} ft ${dv > 0 ? 'higher' : 'lower'} than predicted — wind${sp.water === 'inshore' ? ' or river flow' : ''} is ${dv > 0 ? 'pushing water in; flats and grass flood earlier and deeper' : 'holding water out; flats drain earlier'}.</div>` : '';
  const links = [c && `<a href="https://tidesandcurrents.noaa.gov/stationhome.html?id=${esc(c.id)}" target="_blank" rel="noopener">NOAA ${esc(c.name)}</a>`, b && `<a href="https://www.ndbc.noaa.gov/station_page.php?station=${esc(b.id)}" target="_blank" rel="noopener">Buoy ${esc(b.id)}</a>`, u && `<a href="https://waterdata.usgs.gov/monitoring-location/${esc(u.id)}/" target="_blank" rel="noopener">USGS gauge</a>`, `<a href="https://radar.weather.gov/" target="_blank" rel="noopener">Radar</a>`].filter(Boolean).join(' · ');
  return `<div class="card"><div class="hrow"><h2 style="flex:1;margin:0">Right now</h2><span class="small muted">${times.length ? 'updated ' + ago(Math.max(...times)) : ''}</span></div>
   <div class="grid2" style="margin-top:8px">${rows.join('')}</div>${note}${lake}<div class="note">Live readings from the nearest ${[c && 'NOAA gauge', b && 'NDBC buoy', u && 'USGS stream gauge'].filter(Boolean).join(', ').replace(/, ([^,]*)$/, ' and $1') || 'stations'}. ${links}</div></div>`;
}
// Freshwater lakes rarely have a temperature sensor, so let the angler enter one.
function lakeBox(sp) {
  if (sp.water !== 'fresh') return '';
  const lt = lakeTemp(sp, midnight(Date.now())), a = cond();
  return `<div class="lakebox" style="margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px">
   <label for="lakeT" style="display:block;font-weight:600">Lake water temp °F <span class="small muted">(optional)</span></label>
   <div style="display:flex;gap:8px;margin-top:6px;align-items:center"><input id="lakeT" type="number" inputmode="decimal" min="32" max="95" step="1" style="flex:1 1 auto;min-width:0;width:auto" value="${lt ? lt.v : ''}" placeholder="${lt ? '' : a.wtemp ? a.wtemp + ' estimated — enter yours' : 'from your sonar or thermometer'}">${lt ? '<button class="btn ghost" id="lakeClr" type="button" style="flex:0 0 auto;width:auto;margin:0;padding:8px 14px">Clear</button>' : ''}</div>
   <div class="small muted" style="margin-top:4px">${lt ? `Using ${lt.v}°F you entered ${lt.when} for the bite score (kept for 3 days).` : 'Lakes usually have no live sensor. Enter a reading from your graph or a thermometer and the bite score will use it for this spot for 3 days.'}</div></div>`;
}
function saveLakeTemp(v) {
  const sp = spot(), m = { ...(state.settings.lakeTemp || {}) };
  if (v === '' || v == null || isNaN(+v)) delete m[sp.id]; else m[sp.id] = { v: Math.round(+v), t: Date.now() };
  state.settings.lakeTemp = m; Store.saveSettings(); dayCache.clear();
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
document.addEventListener('change', e => { if (e.target.id === 'lakeT') { const v = e.target.value; if (v !== '' && (+v < 32 || +v > 95)) { toast('Enter 32–95 °F'); return; } saveLakeTemp(v); } });
document.addEventListener('click', e => { if (e.target.id === 'lakeClr') saveLakeTemp(''); });
setInterval(() => { if (document.visibilityState === 'visible' && state.tab === 'forecast' && state.day0 === midnight(Date.now())) render(); }, 10 * 60e3);
</script>
